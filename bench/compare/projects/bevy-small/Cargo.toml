[package]
name = "bevy-small"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "=0.20.1" }
serde = { version = "1", features = ["derive"] }

# The 2D template's profiles (crates/ponko_cli/templates/2d/Cargo.toml.liquid),
# the same for every project of the scoreboard: the engine and the other
# dependencies optimized, your code lightly; the default release profile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package.syn]
opt-level = 0

[workspace]
