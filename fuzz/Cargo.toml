# Fuzz targets for the loaders that read untrusted files and packets
# (fuzz/README.md). Not part of the engine's workspace: run with
# `cargo +nightly fuzz run <target>` from the repository root.
[package]
name = "ponko-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# No window, audio or gamepad: the loaders only. `3d` brings the glTF
# loader, `gltf-meshopt` its decoder of compressed geometry, `lobby` the
# lobby protocol, `aseprite-source` the Aseprite file reader and
# `compressed-textures` the KTX2 and DDS readers, `audio` the sound
# decoders (on Linux it builds the audio output library too: the apt package
# `libasound2-dev`) and `video` the WebM reader and its Vorbis soundtrack
# (its AV1 decoder's x86 assembly needs `nasm` to build).
ponko = { path = "..", default-features = false, features = [
    "3d",
    "gltf-meshopt",
    "lobby",
    "aseprite-source",
    "compressed-textures",
    "audio",
    "video",
] }
ponko_lobby = { path = "../crates/ponko_lobby" }
ponko_unity = { path = "../crates/ponko_unity" }
glam = "0.34.2"

# Its own workspace, so the engine's `cargo build --workspace` leaves it out.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "scene"
path = "fuzz_targets/scene.rs"
test = false
doc = false
bench = false

