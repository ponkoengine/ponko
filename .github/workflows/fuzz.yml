# Fuzzing of the loaders that read untrusted files and packets (fuzz/,
# fuzz/README.md): scenes, prefabs, glTF, the Unity importer's readers,
# action maps, asset packs, the network protocols, sounds and the sound of
# WebM videos (fuzz/targets.txt lists them all).
#
# Every Monday on `main` (and by hand): each target runs a few minutes from
# the committed seeds plus the repository's fixtures. A crash, hang or
# out-of-memory input fails the run and opens one issue per target and
# kind (or comments on the open one), with the inputs as an artifact.
# Nothing runs on pull requests: authors run the targets locally when they
# change a loader (fuzz/README.md).
#
# No secrets. The fuzz job has a read-only token; only the issue job gets
# `issues: write`, and it builds and runs nothing.

name: Fuzz

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '180'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned with the tool: a new cargo-fuzz can change its flags.
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}
      # The fuzz crate builds the engine with `audio` (the audio output
      # library links ALSA on Linux: its headers) and `video` (the AV1
      # decoder's x86 assembly is built with nasm).
      - name: Install system libraries
        run: bash scripts/ci-apt-install.sh libasound2-dev nasm
      # The engine's lock file pins the dependencies the fuzz crate shares
      # with it; cargo adds the few it has of its own.
      - name: Build
        run: |
          cp Cargo.lock fuzz/Cargo.lock
          cargo +nightly fuzz build
      - name: Seed the corpora
        run: fuzz/seed-corpus.sh
      - name: Run every target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '180' }}
        run: fuzz/run-all.sh "$SECONDS_PER_TARGET"
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: fuzz-findings
          path: |
            fuzz/findings.tsv
            fuzz/artifacts
            fuzz/logs
          retention-days: 30
          if-no-files-found: ignore

  # One issue per target and kind of finding, so a known crash doesn't open
  # a new issue every week: the open one gets a comment with the new run.
  issue:
    name: Report findings
    needs: fuzz
    if: ${{ failure() && github.repository == 'ponkoengine/ponko' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Missing when the job failed before anything was written.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: fuzz-findings
          path: fuzz-findings
      - name: Open or update the issues
        run: |
          findings=fuzz-findings/findings.tsv
          if [ ! -s "$findings" ]; then
            # The job failed before fuzzing (a build error, say).
            printf 'build\terror\t-\n' > "$findings"
          fi
          cut -f1,2 "$findings" | sort -u | while IFS=$'\t' read -r target kind; do
            title="Fuzzing: $target ($kind)"
            inputs=$(awk -F'\t' -v t="$target" -v k="$kind" '$1 == t && $2 == k { print "- `" $3 "`" }' "$findings")
            body=$(printf '%s\n' \
              "The weekly fuzz run found inputs that the \`$target\` target reports as \`$kind\` (crash, timeout, oom: out of memory, slow-unit, or error: the run itself failed)." \
              "" \
              "Run: $RUN_URL (artifact \`fuzz-findings\`: the inputs, and each target's log)." \
              "" \
              "$inputs" \
              "" \
              "Reproduce with \`cargo +nightly fuzz run $target <input>\` (fuzz/README.md). Fix the loader, add a regression test, and close this issue.")
            existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body" --label "bug" --label "area: tooling" --label "type: testing"
            fi
          done
