# One failure never hides another: matrices don't fail fast, test steps run
# even after an earlier step failed, and --no-fail-fast runs every suite.
#
# Two tiers keep pull requests fast and runners free:
# - pull_request: only quick Linux checks (leaks, format, clippy, feature
#   contracts, reference images, docs, book), no tests. Authors run the
#   tests on their own machine before opening the pull request.
# - push to main or to a release-* branch (the patch branches, STABILITY.md,
#   CONTRIBUTING.md "Releasing") and workflow_dispatch: the full matrix
#   (macOS, Windows, feature tests, Miri, MSRV, C/C++, web), after the merge.
#   The gate is `github.event_name != 'pull_request'`, not the branch name, so
#   a patch release is tagged on a commit that ran the same matrix as one on
#   main. There is no merge queue (no `merge_group` trigger): pull requests
#   into a release-* branch run the quick tier like any other.
# The API snapshots job is a quick check as well: it fails when api/ (the
# committed listing of the public API) differs from the code
# (scripts/api-snapshots.py, CONTRIBUTING.md "API snapshots").
# The Semver job is one of the quick checks: it runs in every tier, compares
# the published crates' API with the last crates.io release, and reads the
# `breaking` label when it runs (scripts/semver-checks.py, CONTRIBUTING.md
# "Semver checks"; a re-run sees a label added later, as the Reference images
# job does).
# A pull request labelled `full-ci` runs the full matrix too (for risky
# platform changes). Full-tier-only jobs carry
# `if: github.event_name != 'pull_request' || <full-ci label>`.
#
# Only events that change the code start this workflow. Labels and title or
# description edits go to pr-events.yml instead: GitHub can't filter
# `labeled` by label name, so here every area label would start (and, via
# the concurrency group, cancel) a whole run, and a lighter run publishing
# its own "CI passed" on the same commit could stand in for a failed one.
# pr-events.yml re-checks edited PR text for leaks (a leak turns the pull
# request back into a draft, which can't merge) and, when `full-ci` is
# added, starts this workflow on the branch with workflow_dispatch.
#
# Build caches are saved only by runs on main (`save-if`). Every other run
# (release-* branches too) can restore those. Saving elsewhere fills the
# repository's 10 GB cache quota, and GitHub then evicts main's caches: the
# next runs rebuild every dependency.

name: CI

on:
  push:
    # release-*: the patch branches (STABILITY.md); the Semver job fails any
    # break there.
    branches: [main, 'release-*']
  pull_request:
    # Not `edited` or `labeled`: see the header and pr-events.yml.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A new push to a pull request cancels its older run; every commit on main
# or on a release-* branch keeps its own full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # CI never reads debug info, and it makes linking (slow on Windows) and
  # the caches much bigger.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Words from private projects that use the engine must never land here.
  # The list is the LEAK_WORDS secret (so it isn't in this repo either);
  # pull requests from forks don't get secrets, and skip it.
  leaks:
    name: Leak check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Files
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
        run: scripts/leak-check.sh files
      - name: Commit messages
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}~1..{0}', github.sha) }}
        run: scripts/leak-check.sh messages "$RANGE"
      - name: Pull request title and description
        if: github.event_name == 'pull_request'
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.txt"
          scripts/leak-check.sh text "$RUNNER_TEMP/pr.txt"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Naming inventory
        run: python3 scripts/check-naming.py
      # The fragments (a breaking entry needs what to write instead and a
      # before/after snippet) and the script's own rules.
      - name: Changelog fragments
        run: |
          python3 scripts/changelog.py --check
          python3 scripts/changelog.py --selftest
      # The release guard (CONTRIBUTING.md "Releasing") and the guide's note.
      - name: Release scripts
        run: |
          python3 scripts/release-check.py selftest
          python3 scripts/guide-note.py selftest
      # Every C export needs a test, or a reasoned entry in the allowlist.
      - name: C ABI test coverage
        run: python3 scripts/check-ffi-coverage.py
      # Every C function has a C++ wrapper (or a reason on scripts/cpp-c-only.txt),
      # every public C++ declaration a doc comment, and every C/C++ block of the
      # book is an include of a file the native build compiles.
      - name: C++ wrapper coverage and docs
        run: python3 scripts/check-cpp-api.py
      - run: cargo fmt --all --check
      # The Bevy comparison scenes are a crate of their own, outside the
      # workspace. Only their formatting is checked: building them pulls in
      # all of Bevy.
      - name: Format of bench/bevy_scenes
        run: cargo fmt --check --manifest-path bench/bevy_scenes/Cargo.toml

  # The render tests' reference images (tests/fixtures/render) change only
  # through a test run with PONKO_UPDATE_REFERENCES=1, and only with a
  # reviewer having seen them. This job checks every image against its
  # metadata; for a pull request that adds, changes or removes one it
  # uploads the before and after images (the `reference-image-evidence`
  # artifact, also listed in the job summary) and fails until the pull
  # request carries the `references-reviewed` label: a maintainer looks at
  # the artifact, adds the label and re-runs this job. The label is read
  # when the job runs, so a re-run sees it. See the book's "GPU regression
  # tests".
  #
  # The gate holds in every run that can put "CI passed" on a pull
  # request's head, not only `pull_request` runs: a workflow_dispatch run
  # on a branch (what the `full-ci` label starts) looks up the branch's
  # open pull request and asks the same of it. Only main itself, where the
  # change has merged, is checked against the metadata alone.
  #
  # A review covers the images it saw. A push that changes the references
  # again takes a label from before that push off the pull request (the
  # label is older than this run, which the push started); a re-run after
  # the label was added again keeps it.
  reference-images:
    name: Reference images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Write: to take a stale `references-reviewed` label off.
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LABEL: references-reviewed
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The script's own checks
        run: python3 scripts/check-reference-images.py --self-test
      - name: Every reference image matches its metadata
        run: python3 scripts/check-reference-images.py
      # Which pull request this run speaks for, and the commit its
      # references are compared with.
      - name: Find the pull request
        id: pr
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
            echo "base=$EVENT_BASE" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "On $DEFAULT_BRANCH: the references here were reviewed on their pull request."
          else
            # Never empty by accident: a failed lookup fails the job.
            found=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
              --json number,baseRefName --jq '.[0] | select(.) | "\(.number) \(.baseRefName)"')
            if [ -z "$found" ]; then
              # No pull request, nothing to merge: opening one starts its own run.
              echo "::notice::No open pull request for $BRANCH: its references are compared with $DEFAULT_BRANCH for the summary only."
              echo "base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)" >> "$GITHUB_OUTPUT"
            else
              read -r number target <<<"$found"
              echo "Pull request #$number into $target."
              echo "number=$number" >> "$GITHUB_OUTPUT"
              echo "base=$(git merge-base "origin/$target" HEAD)" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Reference images this branch changes
        id: changes
        if: steps.pr.outputs.base != ''
        shell: bash
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          python3 scripts/check-reference-images.py --changed "$BASE" \
            --evidence evidence --summary "$GITHUB_STEP_SUMMARY" | tee changes.log
          echo "changed=$(tail -n 1 changes.log | sed 's/^changed=//')" >> "$GITHUB_OUTPUT"
      - name: Keep the before and after images
        if: ${{ !cancelled() && hashFiles('evidence/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: reference-image-evidence
          path: evidence
          retention-days: 30
      - name: A maintainer has looked at the changed images
        if: steps.pr.outputs.number != '' && steps.changes.outputs.changed != '0'
        shell: bash
        env:
          PR: ${{ steps.pr.outputs.number }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check-reference-images.py --review \
            --repo "$REPO" --pr "$PR" --label "$LABEL" --changed-count "$CHANGED" \
            --event "$EVENT" --action "$ACTION" --before "$BEFORE" --after "$AFTER" \
            --run-id "$GITHUB_RUN_ID"

  # Reduced builds lint one package (`scope`), not the workspace: Cargo
  # unifies features across every package it builds, and other members turn
  # engine features on (the C library enables 3d and navmesh; the MCP
  # server's tests, the defaults).
  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: ""
          - name: profiling feature
            args: --features profiling
          - name: cross-platform deterministic physics
            args: --features ponko/physics-determinism
          - name: steam
            args: --features ponko/steam,ponko_ffi/steam
          - name: control endpoint switch for release builds
            args: --features ponko/control-env,ponko_ffi/control-env
          # The tests derive their components, so `derive` stays on.
          - name: ECS without parallel
            scope: -p ponko_ecs
            args: --no-default-features --features derive
          - name: engine without window or audio
            scope: -p ponko
            args: --no-default-features
          - name: engine without window
            scope: -p ponko
            args: --no-default-features --features audio
          - name: engine with only a window (2D)
            scope: -p ponko
            args: --no-default-features --features window
          - name: engine with every image format
            scope: -p ponko
            args: --no-default-features --features window,image-formats
          # Text shaping without the inspector (whose egui otherwise brings
          # the same shaper in), with the system font lookup.
          - name: engine with text shaping and system fonts
            scope: -p ponko
            args: --no-default-features --features window,system-fonts
          # On Linux this lints the feature's shared code, the AT-SPI adapter
          # and its test; the macOS and Windows adapters are linted in the
          # feature tests' macOS and Windows legs (more runners per pull
          # request would cost more than the adapters' few hundred lines
          # justify).
          - name: accessibility feature
            scope: -p ponko
            args: --features accessibility
          # KTX2/DDS block-compressed textures with the Basis Universal
          # transcoder (C++), and the GPU test and benchmark of them.
          - name: compressed textures
            scope: -p ponko
            args: --features 3d,basis-universal
          # The offscreen rendering benchmarks (`render/scene`, `render/record`).
          - name: benchmarks with the renderer
            scope: -p ponko_bench
            args: --features render
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: clippy-${{ matrix.name }}
      - run: cargo clippy ${{ matrix.scope || '--workspace' }} --all-targets ${{ matrix.args }}

  # Reduced engine builds must not pull in optional subsystems (renderer,
  # audio devices, inspector, glTF, physics, navigation, dev tools); see the
  # script for each build's contract. It only resolves the dependency graph.
  feature-deps:
    name: Feature dependency contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check each reduced build's dependencies
        run: scripts/feature-deps.sh
      - name: A forbidden dependency fails the check
        run: scripts/feature-deps.sh self-test

  # The oldest supported Rust (rust-version in Cargo.toml) still builds everything.
  msrv:
    name: MSRV (Rust 1.95)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv
      - run: cargo check --workspace --all-targets --features ponko/physics,ponko/steam

  # Linux/macOS keep suites together. Windows integration tests, examples,
  # and archived unit-test shards run separately to shorten the critical path.
  test:
    name: Test (${{ matrix.os }})
    # Full tier only: authors run the tests locally before the pull request.
    # (Most of this job is building and linking ~155 test binaries.)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Linux also runs doctests. Windows unit tests have their own job;
      # --test '*' selects all integration targets without running unit tests
      # a second time (--tests would include unit tests too). No job passes
      # --examples: the examples hold no tests, so it would only link each
      # one a second time, as a test binary. They are built once, below.
      - name: Tests (default features)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --workspace --no-fail-fast
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cargo test --workspace --no-fail-fast --bins --test '*'
          else
            cargo test --workspace --no-fail-fast --lib --bins --tests
          fi
      - name: Build examples
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo build --workspace --examples
      # Linux and macOS run the render tests only where the runner has a
      # GPU adapter (they skip with a logged reason otherwise; Windows is
      # the lane that requires one, in windows-unit).
      # Every image comparison's measured difference, passed or failed
      # (target/render-test-output/comparisons.log): the margins on this
      # runner's adapter.
      - name: Margins of the image comparisons
        if: ${{ !cancelled() }}
        shell: bash
        run: sort target/render-test-output/comparisons.log 2>/dev/null || echo "No image comparison ran."
      - name: Keep the images of failed render tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-test-output-${{ matrix.os }}
          path: target/render-test-output
          if-no-files-found: ignore
          retention-days: 14

  windows-unit-build:
    name: Compile unit and render tests (windows-latest)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # This narrower build has a different dependency feature graph;
          # keep its cache separate from the full-workspace jobs.
          shared-key: windows-unit-engine
      - uses: ./.github/actions/nextest
      # Compile only the engine test binary. Other library suites run with
      # the examples, which already need the engine's non-test library.
      # These features match the workspace test union from FFI and benchmarks.
      # Shards reuse these binaries and runtime DLLs without recompiling.
      - name: Archive unit and render tests
        run: cargo nextest archive -p ponko --lib --features physics,physics3d,navmesh,text-shaping --archive-file target/windows-unit.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: windows-unit-tests
          path: target/windows-unit.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  windows-unit:
    name: Unit and render tests (Windows shard ${{ matrix.shard }}/6)
    needs: windows-unit-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nextest
      - uses: actions/download-artifact@v8
        with:
          name: windows-unit-tests
          path: target/ci-unit
      # Slices cover every test exactly once. Limit concurrent tests per
      # runner so software-rendered GPU tests do not swamp the CPU. A few
      # render tests take two to three minutes each on the software adapter
      # and set the floor for a shard; six shards keep the rest of a slice
      # from adding much to that (three took over five minutes).
      # This is the lane where the render tests must run: the runner's
      # software adapter (WARP) is always there, so a test that finds no
      # adapter or device fails instead of skipping.
      - name: Run archived tests
        env:
          PONKO_REQUIRE_GPU: 1
        run: >-
          cargo nextest run --archive-file target/ci-unit/windows-unit.tar.zst
          --workspace-remap . --partition slice:${{ matrix.shard }}/6
          --test-threads 2 --no-fail-fast
      # What a failed image comparison drew, and where it differs.
      # Every image comparison's measured difference, passed or failed
      # (target/render-test-output/comparisons.log): the margins on this
      # runner's adapter.
      - name: Margins of the image comparisons
        if: ${{ !cancelled() }}
        shell: bash
        run: sort target/render-test-output/comparisons.log 2>/dev/null || echo "No image comparison ran."
      - name: Keep the images of failed render tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-test-output-windows-unit-${{ matrix.shard }}
          path: target/render-test-output
          if-no-files-found: ignore
          retention-days: 14

  windows-gpu-tiers:
    name: Render tests on the ${{ matrix.tier }} GPU tier (windows-latest, ${{ matrix.shard }}/2)
    needs: windows-unit-build
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `desktop` is the plain run in windows-unit.
        tier: [webgl2, baseline]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nextest
      - uses: actions/download-artifact@v8
        with:
          name: windows-unit-tests
          path: target/ci-unit
      # The offscreen render suites again, every device opened with the
      # tier's limits (render_test_support::forced); tests needing a
      # feature the tier lacks skip with a logged reason. The capability
      # suite forces its own tiers and runs once, in windows-unit.
      - name: Run the render tests on the forced tier
        shell: bash
        env:
          PONKO_GPU_TIER: ${{ matrix.tier }}
          PONKO_REQUIRE_GPU: 1
        run: |
          set +e
          cargo nextest run --archive-file target/ci-unit/windows-unit.tar.zst \
            --workspace-remap . --partition slice:${{ matrix.shard }}/2 \
            --test-threads 2 --no-fail-fast --success-output final \
            -E '(test(render_test) & !test(capabilities_render_test)) | test(skinning::tests) | test(particles::tests) | test(mips::tests) | test(timer::tests)' \
            2>&1 | tee tier.log
          status=${PIPESTATUS[0]}
          opened=$(grep -c "as the $PONKO_GPU_TIER tier" tier.log)
          echo "devices opened on the forced $PONKO_GPU_TIER tier: $opened"
          if [ "$opened" -eq 0 ]; then
            echo "no render test opened a device on the forced tier" && exit 1
          fi
          echo "render tests run: $(grep -c 'render test ran \[' tier.log), skipped with a reason: $(grep -c 'render test SKIPPED \[' tier.log)"
          exit $status
      # Every image comparison's measured difference, passed or failed
      # (target/render-test-output/comparisons.log): the margins on this
      # runner's adapter.
      - name: Margins of the image comparisons
        if: ${{ !cancelled() }}
        shell: bash
        run: sort target/render-test-output/comparisons.log 2>/dev/null || echo "No image comparison ran."
      - name: Keep the images of failed render tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-test-output-${{ matrix.tier }}-${{ matrix.shard }}
          path: target/render-test-output
          if-no-files-found: ignore
          retention-days: 14

  windows-examples:
    name: Examples and library tests (windows-latest)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test
      - name: Test other library crates
        run: cargo test --workspace --exclude ponko --lib --no-fail-fast
      - name: Build examples
        if: ${{ !cancelled() }}
        run: cargo build --workspace --examples

  # Feature variants run beside the default suite, rather than extending
  # its critical path with five more serial engine builds on every OS.
  test-features:
    name: Feature tests (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Windows needs its complete feature graph cached separately:
          # the faster default job otherwise wins the immutable cache key.
          shared-key: ${{ runner.os == 'Windows' && 'test-features' || 'test' }}
      - name: Tests, ECS without rayon
        if: ${{ !cancelled() }}
        run: cargo test -p ponko_ecs --tests --no-fail-fast --no-default-features --features derive
      # No optional feature at all: no renderer, audio device or inspector.
      # (Audio without a window is linted in the clippy job.)
      - name: Tests, engine with no default features
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --tests --no-fail-fast --no-default-features
      # JPEG off (the no-default-features run above) names the feature in its
      # error; a 2D build with only JPEG loads one; every format loads its own.
      - name: Tests, 2D engine with JPEG only
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --no-default-features --features image-jpeg --test image_formats
          cargo test -p ponko --no-fail-fast --no-default-features --features image-jpeg --lib assets::
      - name: Tests, engine with every image format
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --features image-formats --test image_formats
          cargo test -p ponko --no-fail-fast --features image-formats --lib assets::
      # KTX2 and DDS textures: loading, streaming, arrays and hot reload,
      # and transcoding Basis Universal UASTC (without the feature, a KTX2
      # file's error names it: the no-default-features run above).
      - name: Tests, engine with compressed textures
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --features 3d,compressed-textures --test compressed_textures
          cargo test -p ponko --no-fail-fast --features 3d,basis-universal --test compressed_textures
          cargo test -p ponko --no-fail-fast --features 3d,basis-universal --lib compressed::
          cargo test -p ponko_ffi --no-fail-fast --features compressed-textures --test compressed_textures
      # Shaped text, fallback chains and the system font search, with the
      # offscreen reference images of shaped text where a GPU is found.
      - name: Tests, text shaping and system fonts
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --features 3d,system-fonts --test text_shaping
          cargo test -p ponko --no-fail-fast --features 3d,system-fonts --lib text
      # Systems called through subsecond's jump table (no dx attached) behave the same.
      - name: Tests, engine with hotpatch
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features hotpatch --test headless --test determinism --test events
      # `PONKO_PARALLEL_SYSTEMS=always` turns the scheduler on in every game
      # that doesn't pin its own setting, with every batch on the thread pool.
      # What this proves: games whose view systems follow the environment get
      # the same results in batches on threads as one at a time. Those are
      # `determinism` (view_systems_give_the_same_world_...), `net`
      # (peers_that_schedule_their_view_systems_differently_...: the host in
      # batches, the guest one at a time) and all of `system_views`. The
      # older tests in these files only have `&mut Ctx` systems, which run
      # alone either way: for them the step shows the scheduler leaves them
      # alone. `system_schedule` pins its three modes itself (off, in order,
      # threads) and compares them, so it proves the same here as in `test`.
      - name: Tests, view systems in batches on threads (scheduler forced on)
        if: ${{ !cancelled() }}
        env:
          PONKO_PARALLEL_SYSTEMS: always
        run: cargo test -p ponko --no-fail-fast --test determinism --test net --test net_messages --test net_replication --test system_views --test system_schedule --test schedule_barriers --test events --test change_detection --test phases
      # The same pile on every OS: rapier's cross-platform determinism. The
      # platformer reference game (examples/ember_hop) is played here too: its
      # autopilot clears both levels with the same physics on every OS.
      - name: Tests, physics with cross-platform determinism, and the platformer
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features physics-determinism --test physics --test ember_hop
      # Steam itself isn't on the runners: this checks that the Steam library
      # links and loads on each OS, and the address mapping.
      - name: Tests, Steam transport
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features steam --lib net::steam
      # The screen-reader adapters (opt-in). Every OS: the UI's semantics as
      # AccessKit data, the adapter's own logic, and that the feature builds.
      # macOS: an `NSView` is asked what a screen reader asks, on the main
      # thread, with no window (`ui_access_macos`). Windows: a UI Automation
      # client reads and operates a window that is never shown
      # (`ui_access_platforms`). Each does nothing on the other systems.
      - name: Tests, accessibility adapter
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test -p ponko --no-fail-fast --features accessibility --lib -- ui::access_kit ui::access_native
          cargo test -p ponko --no-fail-fast --features accessibility --test ui_access_macos --test ui_access_platforms --test ui_access --test ui_access_changes
      # Linux: the AT-SPI adapter on a private session bus with the
      # accessibility bus launcher (at-spi2-core), read and operated over
      # D-Bus as Orca does. No display is needed.
      - name: Tests, accessibility adapter over AT-SPI (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          PONKO_ACCESS_ATSPI: 1
        run: |
          bash scripts/ci-apt-install.sh at-spi2-core dbus
          dbus-run-session -- cargo test -p ponko --no-fail-fast --features accessibility --test ui_access_platforms -- --nocapture
      # The macOS and Windows adapters are compiled only in these jobs: lint
      # them here (the clippy job lints the Linux one).
      - name: Clippy, accessibility adapter (macOS, Windows)
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: |
          rustup component add clippy
          cargo clippy -p ponko --all-targets --features accessibility

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps

  # The API of the published crates against the last crates.io release, with
  # cargo-semver-checks. scripts/semver-checks.py decides what a break means:
  # on a release-* branch (or a pull request into one) any break fails; on
  # main, a break this change adds passes only with the `breaking` label and a
  # `### Breaking changes` changelog fragment; and the label itself fails
  # without such a fragment, break found or not. Breaks that earlier merged
  # changes announced don't fail later pull requests. Read CONTRIBUTING.md,
  # "Semver checks", for how to act on a failure.
  #
  # The tool reads rustdoc's JSON, whose format changes with the Rust release,
  # so the tool and the Rust version are pinned together: to move to a newer
  # Rust, move the tool to a release that supports it (its changelog says
  # which rustdoc formats it reads) and run the job on a pull request.
  # No pull_request_target: the labels are read through the API with a
  # read-only token, and the code that runs is the pull request's own.
  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SEMVER_CHECKS_VERSION: 0.51.0
      # Old crates.io releases are built with today's Rust: their warnings
      # must not fail the build.
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
      REF_NAME: ${{ github.ref_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
    steps:
      # Full history: the comparison with the commit a change is based on.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The script's own checks
        run: python3 scripts/semver-checks.py selftest
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: semver
      - name: Cache cargo-semver-checks binary
        id: semver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.SEMVER_CHECKS_VERSION }}
      - uses: taiki-e/install-action@v2
        if: steps.semver-cache.outputs.cache-hit != 'true'
        with:
          tool: cargo-semver-checks@${{ env.SEMVER_CHECKS_VERSION }}
      - run: cargo semver-checks --version
      - name: Check the API of every published crate
        run: python3 scripts/semver-checks.py run

  # The public API of every published crate, listed in api/ (scripts/api-snapshots.py,
  # CONTRIBUTING.md "API snapshots"). The job regenerates the listing and fails
  # with a diff when it differs from the committed files, so every added,
  # renamed or removed public item shows up in review, not only the breaking
  # ones (the Semver job above). The listing comes from `cargo public-api`,
  # which reads rustdoc's JSON; that format changes with every nightly, so the
  # tool and the nightly are pinned together in the script (the pins step
  # hands them to the steps below). Nothing here runs tests.
  api-snapshots:
    name: API snapshots
    runs-on: ubuntu-latest
    env:
      # The script sets its own flags: the nightly's new lints must not fail it.
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
      API_SNAPSHOTS_REGENERATED: ${{ github.workspace }}/api-regenerated
    steps:
      - uses: actions/checkout@v7
      - name: The script's own checks, and its pinned versions
        run: |
          python3 scripts/api-snapshots.py selftest
          python3 scripts/api-snapshots.py pins >> "$GITHUB_ENV"
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.API_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: api-snapshots
      - name: Cache cargo-public-api binary
        id: api-tool-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: cargo-public-api-${{ runner.os }}-${{ runner.arch }}-${{ env.API_TOOL_VERSION }}
      - uses: taiki-e/install-action@v2
        if: steps.api-tool-cache.outputs.cache-hit != 'true'
        with:
          tool: cargo-public-api@${{ env.API_TOOL_VERSION }}
      - run: cargo public-api --version
      - name: Regenerate the listing and compare it with api/
        run: python3 scripts/api-snapshots.py check
      # Every public item of `ponko` has one path besides the prelude
      # (STABILITY.md, "The crate root and globs"): walks rustdoc's JSON,
      # built with the same nightly.
      - name: One public path per item
        run: |
          python3 scripts/check-naming.py --selftest
          python3 scripts/check-naming.py --paths
      # Only when the check failed: the regenerated files, for anyone who
      # cannot run the tool themselves.
      - name: Upload the regenerated listing
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-regenerated
          path: api-regenerated
          if-no-files-found: ignore

  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache mdBook binary
        id: mdbook-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-${{ runner.arch }}-0.5.4
      - uses: taiki-e/install-action@v2
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        with:
          tool: mdbook@0.5.4
      - run: mdbook --version
      - run: mdbook build book
      # The guide's inline Rust snippets: one `cargo check` of every block as a
      # module of a scratch crate (see book/src/contributing.md).
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: book-snippets
      - name: Compile the guide's Rust snippets
        run: python3 scripts/check-book-snippets.py

  miri:
    name: Miri (${{ matrix.name }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    # Miri interprets every instruction; tests shrink their sizes under
    # cfg(miri). The timeout catches a regression instead of hanging CI.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Our unsafe code under the strict model, without rayon.
          - name: ECS, stacked borrows
            args: --tests --no-default-features --features derive
            flags: ""
          # The parallel path. rayon's dependency crossbeam-epoch trips Stacked
          # Borrows (not our code), and its global pool outlives main.
          # `changes` holds the parallel loops over rows picked by change filters,
          # `view_groups` the views that share a world across threads,
          # `query_cache` and `query_cache_views` the parallel loops and view
          # batches that find their archetypes through the query index.
          - name: par_for_each, tree borrows
            args: --test parallel --test changes --test view_groups --test query_cache --test query_cache_views
            flags: -Zmiri-tree-borrows -Zmiri-ignore-leaks
    env:
      MIRIFLAGS: ${{ matrix.flags }}
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p ponko_ecs --no-fail-fast ${{ matrix.args }}

  native:
    name: C and C++ (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: native
      - name: Find the cbindgen version in Cargo.lock
        shell: bash
        run: echo "CBINDGEN_VERSION=$(awk '/^name = "cbindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      # Install just the generator and cache its binary. Running the FFI
      # example would compile and link the engine before reading its source.
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cbindgen@${{ env.CBINDGEN_VERSION }}
      - name: Verify generated C header
        shell: bash
        run: |
          mkdir -p target
          cbindgen --config crates/ponko_ffi/cbindgen.toml crates/ponko_ffi > target/ponko.generated.h
          python - <<'PYTHON'
          from pathlib import Path
          import difflib
          import sys
          # Git and cbindgen can produce different line endings on Windows.
          expected = Path("include/ponko.h").read_text().splitlines(keepends=True)
          actual = Path("target/ponko.generated.h").read_text().splitlines(keepends=True)
          sys.stdout.writelines(difflib.unified_diff(expected, actual, fromfile="checked in", tofile="generated"))
          sys.exit(expected != actual)
          PYTHON
      # control-env: the validation bundle step below drives the release C++
      # battle through PONKO_CONTROL, which a release build honors only with it.
      - run: cargo build -p ponko_ffi --release --features control-env
      - name: Verify dynamic exports
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) library=target/release/ponko_ffi.dll ;;
            macOS) library=target/release/libponko_ffi.dylib ;;
            *) library=target/release/libponko_ffi.so ;;
          esac
          python3 scripts/test-native-symbols.py "$library"
      - run: cmake -S examples/cpp -B target/native -DCMAKE_BUILD_TYPE=Release -DPONKO_LIBRARY_DIR=${{ github.workspace }}/target/release
      - run: cmake --build target/native --config Release
      - run: ctest --test-dir target/native -C Release --output-on-failure
      # A C++ game through the validation bundle tool: started headless,
      # checked through the MCP tools, the bundle verified.
      - name: Validation bundle of the C++ battle
        if: runner.os != 'Windows'
        run: bash scripts/validation-bundle-native.sh target/native/ponko_cpp_battle

  # The web build (wasm32): lint the browser-only code, and build the battle
  # demo the way the docs site does.
  web:
    name: Web build
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: web
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --examples
      # Image decoders work in the browser build too, with every format on.
      - run: cargo check -p ponko --target wasm32-unknown-unknown --features image-formats
      # The 3D examples (the 3D browser smoke fixture among them) need the feature.
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features 3d --examples
      # The tutorials' games (book/src/tutorial-*.md) need physics; they must
      # keep building for the browser.
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features physics,physics3d --example tutorial_2d --example tutorial_3d
      # Compressed textures build for the browser; Basis Universal (C++) is
      # left out there, so UASTC files are an Unsupported error on the web.
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features 3d,basis-universal
      # The accessibility feature has no web adapter (AccessKit has none for
      # a canvas): it must build and do nothing.
      - run: cargo check -p ponko --target wasm32-unknown-unknown --features accessibility
      # Shaping works in the browser; system fonts build and report that the
      # web has none.
      - run: cargo check -p ponko --target wasm32-unknown-unknown --features system-fonts
      - name: Find the wasm-bindgen version in Cargo.lock
        run: echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - run: web/build.sh battle

  # The browser runner's own tests (web/smoke/*.test.mjs): argument and
  # fixture handling, the supported/unsupported decisions, and that a browser
  # that can't start is reported as unsupported with its reason. No browser or
  # wasm build, so it runs on every pull request.
  web-smoke-runner:
    name: Web smoke runner tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --prefix web/smoke --no-audit --no-fund
      - run: node --test web/smoke/*.test.mjs web/gallery/*.test.mjs

  # Runs web builds in headless browsers (web/smoke/README.md): startup,
  # asset fetch, fixed-step progress, a click, a nonblank canvas, and the
  # adapter the engine itself reports. Three builds, each fixture from
  # web/smoke/fixtures.json: the 2D fixture, the 3D one (`--features 3d`) and
  # the complete-game reference. Chromium and WebKit run the WebGL2 path,
  # which must pass in each. Firefox is tried and reported: the runner's
  # headless Firefox has no WebGL2 (no GPU), so it passes as "unsupported"
  # there. GitHub's runners have no GPU, so WebGPU is
  # tried (headless shell and the full browser's new headless mode) and
  # reported: a browser that can't show a WebGPU canvas passes as
  # "unsupported" with the reason in its report and in the job summary, never
  # as a quiet pass; one that can must actually draw it.
  web-smoke:
    name: Web smoke test (headless browsers)
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: web-smoke
      - name: Find the wasm-bindgen version in Cargo.lock
        run: echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      # The browsers are about 500 MB: Playwright downloads only what this
      # cache lacks (the version is pinned by the lockfile).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/smoke/package-lock.json') }}
      - name: Install the runner and the browsers (Chromium with its headless shell, Firefox, WebKit)
        run: |
          node --version
          npm ci --prefix web/smoke --no-audit --no-fund
          bash scripts/ci-retry.sh node web/smoke/node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - name: Runner tests
        run: node --test web/smoke/*.test.mjs web/gallery/*.test.mjs
      # The platformer (examples/ember_hop) publishes its state like
      # coin_dash; its browser run is the web gallery's page check.
      - name: Build the fixtures (2D, 3D with --features 3d, the complete games)
        run: |
          web/build.sh web_smoke
          web/build.sh --features 3d web_smoke_3d
          web/build.sh --features text-shaping coin_dash
          web/build.sh --features physics ember_hop
          web/build.sh lights2d
      # Chromium, WebGL2 (WebGPU hidden, the fallback path).
      - name: Chromium, WebGL2, 2D fixture
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend webgl2 --chrome-trace
      - name: Chromium, WebGL2, 3D fixture
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke_3d --browser chromium --backend webgl2
      # 2D lights (examples/lights2d): the light map, stencil shadows and
      # normal maps on WebGL2.
      - name: Chromium, WebGL2, 2D lights
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture lights2d --browser chromium --backend webgl2
      # The complete-game reference (examples/coin_dash): its coin picture is
      # fetched and decoded, a click and keys reach it, and the screens it
      # reports follow them (play, pause, title, the retained-UI settings
      # screen, Escape closing it again; see fixtures.json). The web build
      # keeps no progress yet (no files in a browser).
      - name: Chromium, WebGL2, coin_dash (assets, a click, keys, screens)
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture coin_dash --browser chromium --backend webgl2
      # WebGPU: the headless shell, then the full browser's new headless mode
      # with software Vulkan (a WebGPU canvas is presented through its
      # compositor). Each passes only if it draws or is reported unsupported.
      - name: Chromium, WebGPU, headless shell
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend webgpu --allow-unsupported
      - name: Chromium, WebGPU, new headless mode (2D and 3D fixtures)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            node web/smoke/smoke.mjs --fixture "$fixture" --browser chromium --chromium-mode new --backend webgpu \
              --browser-arg --use-webgpu-adapter=swiftshader --allow-unsupported || status=1
          done
          exit $status
      - name: Chromium, whatever the engine picks
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend auto --allow-unsupported
      # WebKit: WebGL2 must pass; WebGPU is reported. Firefox: both are
      # reported. Headless Firefox has no WebGL2 on a runner without a GPU
      # (also with Mesa's software GL installed), so "unsupported" passes
      # here with its reason; anything else it does wrong still fails.
      - name: Firefox, WebGL2 (2D and 3D fixtures; reported where it has no WebGL2)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            node web/smoke/smoke.mjs --fixture "$fixture" --browser firefox --backend webgl2 --allow-unsupported || status=1
          done
          exit $status
      - name: Firefox, WebGPU
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser firefox --backend webgpu --allow-unsupported
      - name: WebKit, WebGL2 (2D and 3D fixtures)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            node web/smoke/smoke.mjs --fixture "$fixture" --browser webkit --backend webgl2 || status=1
          done
          exit $status
      - name: WebKit, WebGPU
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser webkit --backend webgpu --allow-unsupported
      # The runner itself: each broken build must be caught as that failure.
      - name: Self-tests (missing asset, startup panic, stalled simulation)
        if: ${{ !cancelled() }}
        run: |
          for case in missing-asset panic stall; do
            node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend webgl2 --case "$case"
          done
      # The web gallery (web/gallery/README.md) with two of its examples and a
      # demo that needs WebGPU, which must show its message on WebGL2: the
      # pages, their loader and the check the release runs on every example.
      # Also the 3D demos that read the scene depth (a lake, screen and target
      # effects) and a texture array's mipmaps, which need the renderer's
      # WebGL2 paths for them.
      - name: Web gallery pages (Chromium, WebGL2)
        if: ${{ !cancelled() }}
        run: |
          node web/gallery/build.mjs --only sprites,3d,compute,terrain,shaders,target_effect
          node web/smoke/gallery.mjs --browser chromium --backend webgl2
      # Every run, with what it asked for, what ran, the adapter the engine
      # reported and why anything was unsupported (also in the artifact).
      - name: Summary of every run
        if: ${{ !cancelled() }}
        run: node web/smoke/summary.mjs target/web-smoke
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-smoke
          path: target/web-smoke
          retention-days: 7

  # The complete-game reference, packaged the way a player gets it and played
  # from an unrelated folder (`ponko package`, through
  # scripts/package-coin-dash.py for the walk-through; book/src/packaging.md):
  # the program, its assets, the licenses and the content and third-party
  # notices; then, on every OS, a headless walk-through (assets found outside
  # the checkout, saves, damaged-save recovery, the OS's default save folder,
  # missing assets failing loudly) and a walk-through in a real window. Linux
  # has no display or GPU: a virtual display and software Vulkan (lavapipe)
  # are installed and the window run must open a window there too. Windows
  # runners have no GPU: the step before the window run restricts wgpu to
  # DirectX 12 (WARP) when no real one is present. A window that can't open is a
  # failure on every OS; only the local `--allow-unsupported` run passes it.
  # The dev profile is packaged: the layout and notices are the release's, and
  # the dependencies are the ones the test jobs already built.
  package-smoke:
    name: Packaged game (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads), a virtual display with the X11 libraries a window loads, and software Vulkan
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev xvfb mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libxinerama1 libx11-xcb1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          # Linux and macOS read the `test` cache (same dev build, default
          # features) and never write it here. Windows has no cache of that kind
          # to share (`test-features` holds other feature builds), so it keeps
          # its own and does not overwrite anyone else's.
          save-if: ${{ github.ref == 'refs/heads/main' || runner.os == 'Windows' }}
          shared-key: ${{ runner.os == 'Windows' && 'package-smoke' || 'test' }}
      - name: The script's own checks (a crate without a license, window errors)
        run: python scripts/package-coin-dash.py selftest
      - name: Package
        run: python scripts/package-coin-dash.py package --profile dev --out target/package
      - name: Smoke test, headless (an unpacked copy, started from an unrelated folder)
        if: ${{ !cancelled() }}
        run: python scripts/package-coin-dash.py smoke --package target/package --mode headless
      # What players download from this OS (zip, an app in a dmg, tar.gz), made
      # and smoke-run by the generic command any game uses.
      - name: The host's download, with ponko package's own smoke run
        if: ${{ !cancelled() }}
        run: cargo run -p ponko_cli -- package --example coin_dash --features text-shaping --profile dev --out target/package-host
      # The engine reads WGPU_BACKEND (not WGPU_ADAPTER_NAME). With only DirectX 12
      # enabled, the one adapter left on a runner without a GPU is WARP, the
      # software renderer, which the engine accepts.
      - name: Windows without a GPU, use the software renderer (WARP) through DirectX 12
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name | Format-Table
          $real = Get-CimInstance Win32_VideoController | Where-Object { $_.Name -notmatch 'Basic Render|Remote Display|Hyper-V|Basic Display' }
          if (-not $real) {
            "WGPU_BACKEND=dx12" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "No GPU on this runner: DirectX 12 only, so wgpu picks WARP"
          }
      - name: Smoke test, in a window
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/package-coin-dash.py smoke --package target/package --mode window
          else
            python scripts/package-coin-dash.py smoke --package target/package --mode window
          fi
      # The platformer reference game (examples/ember_hop, feature physics):
      # its download with the command's own smoke run, then its walk-through
      # from the package, started from an unrelated folder with a data folder
      # of its own: both levels, leaving for the title, continuing the saved
      # run (a world save and load), the end screen and the progress file;
      # headless, then in a window.
      - name: The platformer's download, with ponko package's own smoke run
        if: ${{ !cancelled() }}
        run: cargo run -p ponko_cli -- package --example ember_hop --features physics --profile dev --out target/package-ember
      - name: The platformer's walk-through from its package (headless, then in a window)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          dir=$(find target/package-ember -maxdepth 1 -type d -name 'ember-hop-*' | head -n 1)
          exe=$(find "$dir" -type f \( -name ember_hop -o -name ember_hop.exe \) | head -n 1)
          test -n "$exe" || { echo "no ember_hop program in $dir"; exit 1; }
          exe="$GITHUB_WORKSPACE/$exe"
          check() {
            python -c "import json, sys; r = json.load(open(sys.argv[1])); print(json.dumps(r)); ok = r['finished'] and r['levels_cleared'] == 2 and r['loads'] >= 1 and r['runs_finished'] == 1; sys.exit(0 if ok else 1)" "$1"
          }
          for mode in headless window; do
            work="$RUNNER_TEMP/ember $mode"
            mkdir -p "$work/elsewhere" "$work/data"
            cd "$work/elsewhere"
            if [ "$mode" = window ] && [ "$RUNNER_OS" = "Linux" ]; then
              PONKO_DATA_DIR="$work/data" xvfb-run -a "$exe" --smoke window --report report.json
            else
              PONKO_DATA_DIR="$work/data" "$exe" --smoke "$mode" --report report.json
            fi
            check report.json
            test -f "$work/data/ember-hop/progress.json"
            cd "$GITHUB_WORKSPACE"
          done

  # The reference validation bundles (book/src/validation-bundles.md): the
  # deliberately broken game and the corrected one, run in-process and as a
  # launched game driven through the MCP tools, verified and compared, then
  # published so a reviewer can open what a run observed. Headless.
  validation-bundles:
    name: Validation bundles
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Reads the `test` cache (same dev build) and never writes it.
          save-if: false
          shared-key: test
      - name: Make, verify and compare the bundles
        run: bash scripts/validation-bundles.sh target/validation-bundles
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: validation-bundles
          path: target/validation-bundles
          retention-days: 14
          if-no-files-found: error

  # The `ponko new` templates (crates/ponko_cli/templates) against this
  # engine: the CLI's unit tests, then each template generated with
  # `--path .`, type-checked (the CLI's end-to-end test) and its own tests
  # run. Linux only. A pull request runs it only when it changes the CLI or
  # its templates; the full tier always does (an engine change can break a
  # template too).
  templates:
    name: Project templates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Every generated project builds into this one folder, so the engine
      # and its dependencies build once per feature set.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/templates
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did the CLI or its templates change?
        id: changed
        run: |
          if [ "$FULL" = "true" ] || git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^crates/ponko_cli/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under crates/ponko_cli changed: skipping the template builds."
          fi
      - name: Install ALSA and udev headers (audio, gamepads)
        if: steps.changed.outputs.run == 'true'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: templates
      - name: The CLI's unit tests, each template generated and checked, and a new project packaged
        if: steps.changed.outputs.run == 'true'
        run: |
          cargo test -p ponko_cli
          cargo test -p ponko_cli --test new -- --ignored
          cargo test -p ponko_cli --test package -- --ignored
      - name: Each template's own tests
        if: steps.changed.outputs.run == 'true'
        run: |
          cargo build -p ponko_cli
          cd "$RUNNER_TEMP"
          for kind in 2d 3d headless; do
            "$CARGO_TARGET_DIR/debug/ponko" new "game-$kind" "--$kind" --path "$GITHUB_WORKSPACE"
            (cd "game-$kind" && cargo test)
          done

  # Single check for branch protection: passes only if
  # every job above passed. Requiring one job keeps the rule valid when jobs
  # are added or renamed. Jobs a plain pull request skips (fast tier) are
  # fine; in the full tier a skipped job is a failure. Keep the name
  # "CI passed": branch protection matches it.
  ci-passed:
    name: CI passed
    if: always()
    needs: [leaks, fmt, reference-images, clippy, feature-deps, msrv, test, windows-unit-build, windows-unit, windows-gpu-tiers, windows-examples, test-features, docs, semver, api-snapshots, book, miri, native, web, web-smoke-runner, web-smoke, package-smoke, validation-bundles, templates]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          SKIPPED: ${{ contains(needs.*.result, 'skipped') }}
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          echo "$NEEDS"
          if [ "$FAILED" = "true" ]; then
            echo "Some jobs failed or were cancelled." && exit 1
          fi
          if [ "$FULL" = "true" ] && [ "$SKIPPED" = "true" ]; then
            echo "Some jobs were skipped in a full run." && exit 1
          fi
          echo "Every job this event runs passed."
