# The list of checks: every check the project has, written down in one place.
#
# Run with python3 scripts/run-checks.py. These checks run on maintainer
# machines. The runner reads the job-and-step layout below. It expands OS
# and matrix fields, uses installed Rust toolchains, and skips hosted setup.
# Local metadata: local-os and local-tags are bracketed lists. Use
# local-requires for tools or env:NAME, pkg:NAME, rust:CHANNEL,
# component:CHANNEL/NAME or target:CHANNEL/TRIPLE. Add local-skip with a
# reason for a hosted-only step. The step tag windowed requires explicit opt-in.
#
# scripts/check-feature-coverage.py reads this file as text: every cargo
# feature needs clippy, test and (for docs.rs) doc lines here, and every
# browser smoke runner in web/smoke and web/gallery needs a step that names
# it (CONTRIBUTING.md, "Adding or changing a cargo feature"). The quick
# checks most changes need are listed in AGENTS.md, "Integration checks".
#
# The environment the commands expect:
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # The checks never read debug info, and it makes linking (slow on
  # Windows) and the build folders much bigger.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Words from private projects that use the engine must never land here.
  # The word list is never in this repo: scripts/leak-check.sh reads it from
  # $LEAK_WORDS or a local file. `scripts/leak-check.sh install` runs the
  # file check before every local commit.
  leaks:
    local-os: [Linux, macOS, Windows]
    name: Leak check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Files
        run: scripts/leak-check.sh files
      - name: Commit messages
        run: scripts/leak-check.sh messages "${RANGE:-HEAD~1..HEAD}"
      - name: Pull request title and description
        local-skip: Check PR text separately using scripts/leak-check.sh text.
        if: github.event_name == 'pull_request'
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.txt"
          scripts/leak-check.sh text "$RUNNER_TEMP/pr.txt"

  fmt:
    local-os: [Linux, macOS, Windows]
    local-tags: [quick, lint]
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Checkout line endings
        run: python3 scripts/check-line-endings.py
      - name: Naming inventory
        run: python3 scripts/check-naming.py
      # The fragments (a breaking entry needs what to write instead and a
      # before/after snippet) and the script's own rules.
      - name: Changelog fragments
        run: |
          python3 scripts/changelog.py --check
          python3 scripts/changelog.py --selftest
      # The release guard (CONTRIBUTING.md "Releasing") and the guide's note.
      - name: Release scripts
        run: |
          python3 scripts/release-check.py selftest
          python3 scripts/guide-note.py selftest
      # Every C export needs a test, or a reasoned entry in the allowlist.
      - name: C ABI test coverage
        run: python3 scripts/check-ffi-coverage.py
      # Every C function says who owns each pointer it takes or returns: by
      # the rules at the top of ponko.h, or an "Ownership:" paragraph.
      - name: C ABI pointer ownership
        run: |
          python3 scripts/check-ffi-ownership.py
          python3 scripts/check-ffi-ownership.py --selftest
      # Every unsafe item outside the ECS has a test (scripts/unsafe-inventory.txt).
      - name: Unsafe code inventory
        run: |
          python3 scripts/check-unsafe.py
          python3 scripts/check-unsafe.py --selftest
      # Every C function has a C++ wrapper (or a reason on scripts/cpp-c-only.txt),
      # every public C++ declaration a doc comment, and every C/C++ block of the
      # book is an include of a file the native build compiles.
      - name: C++ wrapper coverage and docs
        run: python3 scripts/check-cpp-api.py
      - name: Check runner self-tests
        run: python3 scripts/run-checks.py --selftest
      - name: Public API by use
        run: python3 scripts/api-usage.py selftest && python3 scripts/api-usage.py check
      # The experimental items outside the versions' promise
      # (scripts/experimental-api.txt) match the guide's levels, api/ and the
      # Unstable notes of the C header and the C++ wrapper.
      - name: Experimental items
        run: |
          python3 scripts/experimental-api.py check
          python3 scripts/experimental-api.py selftest
      # `cargo fmt --all --check` checks the same files, but in one rustfmt
      # command that passes Windows' command-line limit in a long checkout path.
      - name: Workspace Rust formatting
        run: python3 scripts/fmt-workspace.py --check
      # The Bevy comparison scenes are a crate of their own, outside the
      # workspace. Only their formatting is checked: building them pulls in
      # all of Bevy.
      - name: Format of bench/compare
        run: cargo fmt --check --manifest-path bench/compare/Cargo.toml

  # The render tests' reference images (tests/fixtures/render) change only
  # through a test run with PONKO_UPDATE_REFERENCES=1, and only with a
  # reviewer having seen them. This job checks every image against its
  # metadata; for a pull request that adds, changes or removes one it
  # uploads the before and after images (the `reference-image-evidence`
  # artifact, also listed in the job summary) and fails until the pull
  # request carries the `references-reviewed` label: a maintainer looks at
  # the artifact, adds the label and re-runs this job. The label is read
  # when the job runs, so a re-run sees it. See the book's "GPU regression
  # tests".
  #
  # The gate holds in every run that can put "CI passed" on a pull
  # request's head, not only `pull_request` runs: a workflow_dispatch run
  # on a branch (what the `full-ci` label starts) looks up the branch's
  # open pull request and asks the same of it. Only main itself, where the
  # change has merged, is checked against the metadata alone.
  #
  # A review covers the images it saw. A push that changes the references
  # again takes a label from before that push off the pull request (the
  # label is older than this run, which the push started); a re-run after
  # the label was added again keeps it.
  reference-images:
    local-os: [Linux, macOS, Windows]
    local-tags: [quick, lint]
    name: Reference images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Write: to take a stale `references-reviewed` label off.
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LABEL: references-reviewed
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The script's own checks
        run: python3 scripts/check-reference-images.py --self-test
      - name: Every reference image matches its metadata
        run: python3 scripts/check-reference-images.py
      # Which pull request this run speaks for, and the commit its
      # references are compared with.
      - name: Find the pull request
        local-skip: Requires a pull request and hosted review metadata.
        id: pr
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
            echo "base=$EVENT_BASE" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "On $DEFAULT_BRANCH: the references here were reviewed on their pull request."
          else
            # Never empty by accident: a failed lookup fails the job.
            found=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
              --json number,baseRefName --jq '.[0] | select(.) | "\(.number) \(.baseRefName)"')
            if [ -z "$found" ]; then
              # No pull request, nothing to merge: opening one starts its own run.
              echo "::notice::No open pull request for $BRANCH: its references are compared with $DEFAULT_BRANCH for the summary only."
              echo "base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)" >> "$GITHUB_OUTPUT"
            else
              read -r number target <<<"$found"
              echo "Pull request #$number into $target."
              echo "number=$number" >> "$GITHUB_OUTPUT"
              echo "base=$(git merge-base "origin/$target" HEAD)" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Reference images this branch changes
        local-skip: Requires a pull request and hosted review metadata.
        id: changes
        if: steps.pr.outputs.base != ''
        shell: bash
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          python3 scripts/check-reference-images.py --changed "$BASE" \
            --evidence evidence --summary "$GITHUB_STEP_SUMMARY" | tee changes.log
          echo "changed=$(tail -n 1 changes.log | sed 's/^changed=//')" >> "$GITHUB_OUTPUT"
      - name: Keep the before and after images
        if: ${{ !cancelled() && hashFiles('evidence/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: reference-image-evidence
          path: evidence
          retention-days: 30
      # A maintainer looks at evidence/index.html and adds the
      # references-reviewed label to the pull request (book/src/render-tests.md).

  # Reduced builds lint one package (`scope`), not the workspace: Cargo
  # unifies features across every package it builds, and other members turn
  # engine features on (the C library enables 3d and navmesh; the MCP
  # server's tests, the defaults).
  clippy:
    local-tags: [lint]
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: ""
          - name: profiling feature
            args: --features profiling
          - name: cross-platform deterministic physics
            args: --features ponko/physics-determinism
          - name: steam
            args: --features ponko/steam,ponko_ffi/steam
          - name: control endpoint switch for release builds
            args: --features ponko/control-env,ponko_ffi/control-env
          # The tests derive their components, so `derive` stays on.
          - name: ECS without parallel
            scope: -p ponko_ecs
            args: --no-default-features --features derive
          - name: engine without window or audio
            scope: -p ponko
            args: --no-default-features
          - name: engine without window
            scope: -p ponko
            args: --no-default-features --features audio
          - name: engine with only a window (2D)
            scope: -p ponko
            args: --no-default-features --features window
          - name: engine with every image format
            scope: -p ponko
            args: --no-default-features --features window,image-formats
          # Text shaping without the inspector (whose egui otherwise brings
          # the same shaper in), with the system font lookup.
          - name: engine with text shaping and system fonts
            scope: -p ponko
            args: --no-default-features --features window,system-fonts
          # On Linux this lints the feature's shared code, the AT-SPI adapter
          # and its test; the macOS and Windows adapters are linted in the
          # feature tests' macOS and Windows legs (more runners per pull
          # request would cost more than the adapters' few hundred lines
          # justify).
          - name: accessibility feature
            scope: -p ponko
            args: --features accessibility
          # KTX2/DDS block-compressed textures with the Basis Universal
          # transcoder (C++), and the GPU test and benchmark of them; glTF
          # geometry compressed with meshopt (meshoptimizer's C++ decoder).
          - name: compressed textures and geometry
            scope: -p ponko
            args: --features 3d,basis-universal,gltf-meshopt
          # The block-compressed textures alone, without 3D (2D games load
          # KTX2 and DDS too; what only glTF models use must stay gated).
          - name: compressed textures without 3D
            scope: -p ponko
            args: --features compressed-textures
          # The command line tool's cook and texture features, each alone and
          # the three that need no Aseprite (a test or a dependency used by
          # only some combinations fails here, not in a user's `cargo install`).
          - name: command line tool with no features
            scope: -p ponko_cli
            args: --no-default-features
          - name: command line tool with textures only
            scope: -p ponko_cli
            args: --no-default-features --features textures
          - name: command line tool with meshes only
            scope: -p ponko_cli
            args: --no-default-features --features meshes
          - name: command line tool with shaders only
            scope: -p ponko_cli
            args: --no-default-features --features shaders
          - name: command line tool with Aseprite only
            scope: -p ponko_cli
            args: --no-default-features --features aseprite
          - name: command line tool with textures, meshes and shaders
            scope: -p ponko_cli
            args: --no-default-features --features meshes,textures,shaders
          # Every benchmark driver: the offscreen rendering benchmarks
          # (`render/scene`, `render/record`), the positional sound, shaped
          # text and video decoding ones.
          - name: benchmarks with every feature
            scope: -p ponko_bench
            args: --all-features
          # The editor as an app (`ponko editor`): the inspector's panels in
          # edit mode, saving scenes and prefabs.
          - name: editor feature
            scope: -p ponko
            args: --features editor
          # Loose `.aseprite` files read directly in development.
          - name: aseprite-source feature
            scope: -p ponko
            args: --features aseprite-source
          # Gamepads through SDL 3 instead of gilrs (gyro, trigger rumble).
          # Linting needs no SDL library: nothing is linked.
          - name: gamepad-sdl feature
            scope: -p ponko
            args: --features gamepad-sdl
          # WebM playback (AV1 pictures, Vorbis sound), desktop only.
          - name: video feature
            scope: -p ponko
            args: --features video
          - name: C library with video
            scope: -p ponko_ffi
            args: --features video
          # The lobby client alone (no window, audio or other optional
          # subsystem), then with the WebRTC endpoints on top of it.
          - name: lobby client without a window
            scope: -p ponko
            args: --no-default-features --features lobby
          - name: WebRTC endpoints
            scope: -p ponko
            args: --features lobby,webrtc
          # Systems called through subsecond's jump table.
          - name: hot patching
            scope: -p ponko
            args: --features hotpatch
          - name: ECS with serde
            scope: -p ponko_ecs
            args: --features serde
          - name: lobby server with WebRTC
            scope: -p ponko_lobby
            args: --features webrtc
          # Every export of the C library on, so each feature's C functions
          # are linted: the editor, accessibility, Basis Universal, system
          # fonts and WebRTC ones.
          - name: C library with every feature
            scope: -p ponko_ffi
            args: --all-features
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: clippy-${{ matrix.name }}
      - run: cargo clippy ${{ matrix.scope || '--workspace' }} --all-targets ${{ matrix.args }}

  # Reduced engine builds must not pull in optional subsystems (renderer,
  # audio devices, inspector, glTF, physics, navigation, dev tools); see the
  # script for each build's contract. It only resolves the dependency graph.
  feature-deps:
    local-os: [Linux, macOS, Windows]
    local-tags: [lint]
    name: Feature dependency contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check each reduced build's dependencies
        run: scripts/feature-deps.sh
      - name: A forbidden dependency fails the check
        run: scripts/feature-deps.sh self-test

  # The oldest supported Rust (rust-version in Cargo.toml) still builds everything.
  msrv:
    local-tags: [lint]
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv
      - run: cargo check --workspace --all-targets --features ponko/physics,ponko/steam

  # Linux/macOS keep suites together. Windows integration tests, examples,
  # and archived unit-test shards run separately to shorten the critical path.
  test:
    local-tags: [test, gpu]
    name: Test (${{ matrix.os }})
    # Full tier only: authors run the tests locally before the pull request.
    # (Most of this job is building and linking ~155 test binaries.)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Linux also runs doctests. Windows unit tests have their own job;
      # --test '*' selects all integration targets without running unit tests
      # a second time (--tests would include unit tests too). No job passes
      # --examples: the examples hold no tests, so it would only link each
      # one a second time, as a test binary. They are built once, below.
      - name: Tests (default features)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --workspace --no-fail-fast
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cargo test --workspace --no-fail-fast --bins --test '*'
          else
            cargo test --workspace --no-fail-fast --lib --bins --tests
          fi
      - name: Build examples
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo build --workspace --examples
      # Linux keeps no frame pointers by default, so the native crash
      # backtrace tests check the whole chain only in a build that has them
      # (`tests/native_crash.rs`, the guide's "Backtraces of a native crash").
      # Its own target directory: the flag rebuilds everything.
      - name: Native crash backtraces with frame pointers (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          RUSTFLAGS: -D warnings -C force-frame-pointers=yes
          PONKO_CRASH_TESTS_FRAME_POINTERS: 1
          CARGO_TARGET_DIR: target/frame-pointers
        run: cargo test -p ponko --no-fail-fast --test native_crash
      # Linux and macOS run the render tests only where the runner has a
      # GPU adapter (they skip with a logged reason otherwise; Windows is
      # the lane that requires one, in windows-unit).
      # Every image comparison's measured difference, passed or failed
      # (target/render-test-output/comparisons.log): the margins on this
      # runner's adapter.
      - name: Margins of the image comparisons
        if: ${{ !cancelled() }}
        shell: bash
        run: sort target/render-test-output/comparisons.log 2>/dev/null || echo "No image comparison ran."
      - name: Keep the images of failed render tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-test-output-${{ matrix.os }}
          path: target/render-test-output
          if-no-files-found: ignore
          retention-days: 14

  windows-unit-build:
    local-requires: [cargo-nextest]
    name: Compile unit and render tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # This narrower build has a different dependency feature graph;
          # keep its cache separate from the full-workspace jobs.
          shared-key: windows-unit-engine
      - uses: ./.github/actions/nextest
      # Compile only the engine test binary. Other library suites run with
      # the examples, which already need the engine's non-test library.
      # These features match the workspace test union from FFI and benchmarks.
      # Shards reuse these binaries and runtime DLLs without recompiling.
      - name: Archive unit and render tests
        run: cargo nextest archive -p ponko --lib --features physics,physics3d,navmesh,text-shaping --archive-file target/windows-unit.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: windows-unit-tests
          path: target/windows-unit.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  windows-unit:
    local-requires: [cargo-nextest]
    local-tags: [test, gpu]
    name: Unit and render tests (Windows shard ${{ matrix.shard }}/6)
    needs: windows-unit-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nextest
      - uses: actions/download-artifact@v8
        with:
          name: windows-unit-tests
          path: target/ci-unit
      # Slices cover every test exactly once. Limit concurrent tests per
      # runner so software-rendered GPU tests do not swamp the CPU. A few
      # render tests take two to three minutes each on the software adapter
      # and set the floor for a shard; six shards keep the rest of a slice
      # from adding much to that (three took over five minutes).
      # This is the lane where the render tests must run: the runner's
      # software adapter (WARP) is always there, so a test that finds no
      # adapter or device fails instead of skipping.
      - name: Run archived tests
        env:
          PONKO_REQUIRE_GPU: 1
        run: >-
          cargo nextest run --archive-file target/windows-unit.tar.zst
          --workspace-remap . --partition slice:${{ matrix.shard }}/6
          --test-threads 2 --no-fail-fast
      # What a failed image comparison drew, and where it differs.
      # Every image comparison's measured difference, passed or failed
      # (target/render-test-output/comparisons.log): the margins on this
      # runner's adapter.
      - name: Margins of the image comparisons
        if: ${{ !cancelled() }}
        shell: bash
        run: sort target/render-test-output/comparisons.log 2>/dev/null || echo "No image comparison ran."
      - name: Keep the images of failed render tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-test-output-windows-unit-${{ matrix.shard }}
          path: target/render-test-output
          if-no-files-found: ignore
          retention-days: 14

  windows-gpu-tiers:
    local-requires: [cargo-nextest]
    local-tags: [test, gpu]
    name: Render tests on the ${{ matrix.tier }} GPU tier (windows-latest, ${{ matrix.shard }}/2)
    needs: windows-unit-build
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `desktop` is the plain run in windows-unit.
        tier: [webgl2, baseline]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nextest
      - uses: actions/download-artifact@v8
        with:
          name: windows-unit-tests
          path: target/ci-unit
      # The offscreen render suites again, every device opened with the
      # tier's limits (render_test_support::forced); tests needing a
      # feature the tier lacks skip with a logged reason. The capability
      # suite forces its own tiers and runs once, in windows-unit.
      - name: Run the render tests on the forced tier
        shell: bash
        env:
          PONKO_GPU_TIER: ${{ matrix.tier }}
          PONKO_REQUIRE_GPU: 1
        run: |
          set +e
          cargo nextest run --archive-file target/windows-unit.tar.zst \
            --workspace-remap . --partition slice:${{ matrix.shard }}/2 \
            --test-threads 2 --no-fail-fast --success-output final \
            -E '(test(render_test) & !test(capabilities_render_test)) | test(skinning::tests) | test(particles::tests) | test(mips::tests) | test(timer::tests)' \
            2>&1 | tee tier.log
          status=${PIPESTATUS[0]}
          opened=$(grep -c "as the $PONKO_GPU_TIER tier" tier.log)
          echo "devices opened on the forced $PONKO_GPU_TIER tier: $opened"
          if [ "$opened" -eq 0 ]; then
            echo "no render test opened a device on the forced tier" && exit 1
          fi
          echo "render tests run: $(grep -c 'render test ran \[' tier.log), skipped with a reason: $(grep -c 'render test SKIPPED \[' tier.log)"
          exit "$status"
      # Every image comparison's measured difference, passed or failed
      # (target/render-test-output/comparisons.log): the margins on this
      # runner's adapter.
      - name: Margins of the image comparisons
        if: ${{ !cancelled() }}
        shell: bash
        run: sort target/render-test-output/comparisons.log 2>/dev/null || echo "No image comparison ran."
      - name: Keep the images of failed render tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-test-output-${{ matrix.tier }}-${{ matrix.shard }}
          path: target/render-test-output
          if-no-files-found: ignore
          retention-days: 14

  windows-examples:
    local-tags: [test]
    name: Examples and library tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test
      - name: Test other library crates
        run: cargo test --workspace --exclude ponko --lib --no-fail-fast
      - name: Build examples
        if: ${{ !cancelled() }}
        run: cargo build --workspace --examples

  # Feature variants run beside the default suite, rather than extending
  # its critical path with five more serial engine builds on every OS.
  test-features:
    local-tags: [test, gpu]
    name: Feature tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Windows needs its complete feature graph cached separately:
          # the faster default job otherwise wins the immutable cache key.
          shared-key: ${{ runner.os == 'Windows' && 'test-features' || 'test' }}
      - name: Tests, WebSocket control bridge with a fake browser
        run: cargo test -p ponko_mcp --test web_bridge
      - name: Tests, browser control feature in the native capabilities inventory
        run: cargo test -p ponko --features web-control --lib control::capabilities
      - name: Tests, ECS without rayon
        if: ${{ !cancelled() }}
        run: cargo test -p ponko_ecs --tests --no-fail-fast --no-default-features --features derive
      # No optional feature at all: no renderer, audio device or inspector.
      # (Audio without a window is linted in the clippy job.)
      - name: Tests, engine with no default features
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --tests --no-fail-fast --no-default-features
      - name: Tests, developer console release opt-in
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --release --no-default-features --test console
      # The command line tool's feature subsets: its unit tests (the cook and
      # texture code) with each of its features alone, and the three without
      # Aseprite.
      - name: Tests, command line tool feature subsets
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko_cli --no-fail-fast --no-default-features --bin ponko
          cargo test -p ponko_cli --no-fail-fast --no-default-features --features textures --bin ponko
          cargo test -p ponko_cli --no-fail-fast --no-default-features --features meshes --bin ponko
          cargo test -p ponko_cli --no-fail-fast --no-default-features --features shaders --bin ponko
          cargo test -p ponko_cli --no-fail-fast --no-default-features --features aseprite --bin ponko
          cargo test -p ponko_cli --no-fail-fast --no-default-features --features meshes,textures,shaders --bin ponko
      # JPEG off (the no-default-features run above) names the feature in its
      # error; a 2D build with only JPEG loads one; every format loads its own.
      - name: Tests, 2D engine with JPEG only
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --no-default-features --features image-jpeg --test image_formats
          cargo test -p ponko --no-fail-fast --no-default-features --features image-jpeg --lib assets::
      - name: Tests, engine with every image format
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --features image-formats --test image_formats
          cargo test -p ponko --no-fail-fast --features image-formats --lib assets::
      # KTX2 and DDS textures: loading, streaming, arrays and hot reload,
      # and transcoding Basis Universal UASTC (without the feature, a KTX2
      # file's error names it: the no-default-features run above).
      - name: Tests, engine with compressed textures
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --features 3d,compressed-textures --test compressed_textures
          cargo test -p ponko --no-fail-fast --features 3d,basis-universal --test compressed_textures
          cargo test -p ponko --no-fail-fast --features 3d,basis-universal --lib compressed::
          cargo test -p ponko_ffi --no-fail-fast --features compressed-textures --test compressed_textures
      # glTF files with meshopt-compressed geometry, decompressed by
      # meshoptimizer's C++ decoder (without the feature, such a file's
      # error names it: the workspace tests).
      - name: Tests, glTF with compressed geometry
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features 3d,gltf-meshopt --lib three::gltf
      # The wasm-simd feature does nothing natively: the CPU wave spectrum's
      # tests must pass with it on all the same.
      - name: Tests, water spectrum with wasm-simd
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features 3d,wasm-simd --lib water::spectrum
      # Shaped text, fallback chains and the system font search, with the
      # offscreen reference images of shaped text where a GPU is found.
      - name: Tests, text shaping and system fonts
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --features 3d,system-fonts --test text_shaping
          cargo test -p ponko --no-fail-fast --features 3d,system-fonts --lib text
      # The editor as an app: documents, undo, saving scenes and prefabs,
      # cooking and play mode, all without a window; then its panels (the
      # inspector's modules with the editor on: file picker, path field,
      # keys after a dialog, asset panel).
      - name: Tests, editor
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --features editor --lib editor
          cargo test -p ponko --no-fail-fast --features editor --lib inspector
      # `.aseprite` source files loaded without an export beside them.
      - name: Tests, aseprite-source
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features aseprite-source --test aseprite
      # The SDL 3 gamepad backend: its tests drive SDL's own virtual
      # gamepads (no device, no window) and a scripted device layer. It
      # links SDL 3, which Homebrew has (Ubuntu's LTS release doesn't yet).
      - name: Tests, SDL gamepad backend
        local-requires: [pkg:sdl3]
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          cargo test -p ponko --no-fail-fast --features gamepad-sdl --lib gamepad_sdl
      # WebM files with AV1 pictures and Vorbis sound (desktop only: on the
      # web loading a video reports `Unsupported`).
      - name: Tests, video
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --features video --test video
          cargo test -p ponko --no-fail-fast --features video --lib video
          cargo test -p ponko_ffi --no-fail-fast --features video --test video
      # The lobby client with nothing else in the build, then WebRTC
      # endpoints: the engine's own tests, the lobby server's (its relay
      # carries the signaling) and the C library's, on loopback.
      - name: Tests, lobby client and WebRTC endpoints
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --no-default-features --features lobby --lib net::lobby
          cargo test -p ponko --no-fail-fast --features lobby,webrtc --lib net::rtc
          cargo test -p ponko_lobby --no-fail-fast --features webrtc --test webrtc
          cargo test -p ponko_ffi --no-fail-fast --features webrtc --test rtc
      # The C library's optional features: the editor, system fonts,
      # accessibility and Basis Universal (their C functions fail with an
      # error naming the feature without them).
      - name: Tests, C library with optional features
        if: ${{ !cancelled() }}
        run: cargo test -p ponko_ffi --no-fail-fast --features editor,system-fonts,accessibility,basis-universal --test text_shaping --test ui_access --test access --test compressed_textures
      # Code mods from C: looking up and calling a mod's function, the
      # entities and prefabs a mod may reach (without the feature the calls
      # say code mods are not compiled in, which the default run covers).
      - name: Tests, C library with code mods
        if: ${{ !cancelled() }}
        run: cargo test -p ponko_ffi --no-fail-fast --features mods-wasm --test mod_code
      - name: Tests, ECS with serde
        if: ${{ !cancelled() }}
        run: cargo test -p ponko_ecs --no-fail-fast --features serde --test entities
      # The profiling tests with puffin's scopes and server compiled in.
      - name: Tests, profiling feature
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features profiling --test profiling
      # Systems called through subsecond's jump table (no dx attached) behave the same.
      - name: Tests, engine with hotpatch
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features hotpatch --test headless --test determinism --test events
      # `PONKO_PARALLEL_SYSTEMS=always` turns the scheduler on in every game
      # that doesn't pin its own setting, with every batch on the thread pool.
      # What this proves: games whose view systems follow the environment get
      # the same results in batches on threads as one at a time. Those are
      # `determinism` (view_systems_give_the_same_world_...), `net`
      # (peers_that_schedule_their_view_systems_differently_...: the host in
      # batches, the guest one at a time) and all of `system_views`. The
      # older tests in these files only have `&mut Ctx` systems, which run
      # alone either way: for them the step shows the scheduler leaves them
      # alone. `system_schedule` pins its three modes itself (off, in order,
      # threads) and compares them, so it proves the same here as in `test`.
      - name: Tests, view systems in batches on threads (scheduler forced on)
        if: ${{ !cancelled() }}
        env:
          PONKO_PARALLEL_SYSTEMS: always
        run: cargo test -p ponko --no-fail-fast --test determinism --test net --test net_messages --test net_replication --test system_views --test system_schedule --test schedule_barriers --test events --test change_detection --test phases
      # The same pile on every OS: rapier's cross-platform determinism. The
      # platformer reference game (examples/ember_hop) is played here too: its
      # autopilot clears both levels with the same physics on every OS.
      - name: Tests, physics with cross-platform determinism, and the platformer
        if: ${{ !cancelled() }}
        run: cargo test -p ponko --no-fail-fast --features physics-determinism --test physics --test ember_hop
      # Steam itself isn't on the runners: this checks that the Steam library
      # links and loads on each OS, the address mapping, and the store
      # services (achievements, cloud saves, ...) against the fake and absent.
      - name: Tests, Steam transport and services
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ponko --no-fail-fast --features steam --lib net::steam
          cargo test -p ponko --no-fail-fast --features steam --lib steam::tests
          cargo test -p ponko --no-fail-fast --features steam --test steam_services
          cargo test -p ponko_ffi --no-fail-fast --features steam --test steam_messages --test steam_services
      # The screen-reader adapters (opt-in). Every OS: the UI's semantics as
      # AccessKit data, the adapter's own logic, and that the feature builds.
      # macOS: an `NSView` is asked what a screen reader asks, on the main
      # thread, with no window (`ui_access_macos`). Windows: a UI Automation
      # client reads and operates a window that is never shown
      # (`ui_access_platforms`). Each does nothing on the other systems.
      - name: Tests, accessibility adapter
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test -p ponko --no-fail-fast --features accessibility --lib -- ui::access_kit ui::access_native
          cargo test -p ponko --no-fail-fast --features accessibility --test ui_access_macos --test ui_access_platforms --test ui_access --test ui_access_changes
          # Built, not run: the engine's own window needs a person
          # (`ui_access_window -- --ignored`, see the file's header).
          cargo test -p ponko --features accessibility --test ui_access_window --no-run
      # Linux: the AT-SPI adapter on a private session bus with the
      # accessibility bus launcher (at-spi2-core), read and operated over
      # D-Bus as Orca does. No display is needed.
      - name: Tests, accessibility adapter over AT-SPI (Linux)
        local-requires: [dbus-run-session]
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          PONKO_ACCESS_ATSPI: 1
        run: |
          dbus-run-session -- cargo test -p ponko --no-fail-fast --features accessibility --test ui_access_platforms -- --nocapture
      # The macOS and Windows adapters are compiled only in these jobs: lint
      # them here (the clippy job lints the Linux one).
      - name: Clippy, accessibility adapter (macOS, Windows)
        local-requires: [component:stable/clippy]
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: |
          cargo clippy -p ponko --all-targets --features accessibility

  docs:
    local-tags: [docs]
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps
      # The features docs.rs builds (Cargo.toml, [package.metadata.docs.rs]),
      # with the editor as well: their docs must build without warnings
      # (RUSTDOCFLAGS denies them).
      - name: Docs with every public feature
        run: |
          cargo doc -p ponko --no-deps --features physics,physics3d,physics-determinism,steam,3d,navmesh,accessibility,control-env,profiling,video,lobby,webrtc,mods-wasm,editor
          cargo doc -p ponko_ecs -p ponko_ffi --no-deps --all-features

  # The API of the published crates against the last crates.io release, with
  # cargo-semver-checks. scripts/semver-checks.py decides what a break means:
  # on a release-* branch (or a pull request into one) any break fails; on
  # main, a break this change adds passes only with the `breaking` label and a
  # `### Breaking changes` changelog fragment; and the label itself fails
  # without such a fragment, break found or not. Breaks that earlier merged
  # changes announced don't fail later pull requests. Read CONTRIBUTING.md,
  # "Semver checks", for how to act on a failure.
  #
  # The tool reads rustdoc's JSON, whose format changes with the Rust release,
  # so the tool and the Rust version are pinned together: to move to a newer
  # Rust, move the tool to a release that supports it (its changelog says
  # which rustdoc formats it reads) and run the job on a pull request.
  # No pull_request_target: the labels are read through the API with a
  # read-only token, and the code that runs is the pull request's own.
  semver:
    local-tags: [api]
    local-requires: [cargo-semver-checks]
    name: Semver checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SEMVER_CHECKS_VERSION: 0.51.0
      # Old crates.io releases are built with today's Rust: their warnings
      # must not fail the build.
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
    steps:
      # Full history: the comparison with the commit a change is based on.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The script's own checks
        run: python3 scripts/semver-checks.py selftest
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: semver
      - name: Cache cargo-semver-checks binary
        id: semver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.SEMVER_CHECKS_VERSION }}
      - uses: taiki-e/install-action@v2
        if: steps.semver-cache.outputs.cache-hit != 'true'
        with:
          tool: cargo-semver-checks@${{ env.SEMVER_CHECKS_VERSION }}
      - run: cargo semver-checks --version
      - name: Check the API of every published crate
        # Add --breaking when the pull request has the `breaking` label;
        # --base release-X.Y for a pull request into a release branch.
        run: python3 scripts/semver-checks.py run

  # The public API of every published crate, listed in api/ (scripts/api-snapshots.py,
  # CONTRIBUTING.md "API snapshots"). The job regenerates the listing and fails
  # with a diff when it differs from the committed files, so every added,
  # renamed or removed public item shows up in review, not only the breaking
  # ones (the Semver job above). The listing comes from `cargo public-api`,
  # which reads rustdoc's JSON; that format changes with every nightly, so the
  # tool and the nightly are pinned together in the script (the pins step
  # hands them to the steps below). Nothing here runs tests.
  api-snapshots:
    local-tags: [api]
    local-requires: [cargo-public-api]
    name: API snapshots
    runs-on: ubuntu-latest
    env:
      # The script sets its own flags: the nightly's new lints must not fail it.
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
      API_SNAPSHOTS_REGENERATED: ${{ github.workspace }}/api-regenerated
    steps:
      - uses: actions/checkout@v7
      - name: The script's own checks, and its pinned versions
        run: |
          python3 scripts/api-snapshots.py selftest
          python3 scripts/api-snapshots.py pins >> "$GITHUB_ENV"
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.API_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: api-snapshots
      - name: Cache cargo-public-api binary
        id: api-tool-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: cargo-public-api-${{ runner.os }}-${{ runner.arch }}-${{ env.API_TOOL_VERSION }}
      - uses: taiki-e/install-action@v2
        if: steps.api-tool-cache.outputs.cache-hit != 'true'
        with:
          tool: cargo-public-api@${{ env.API_TOOL_VERSION }}
      - run: cargo public-api --version
      - name: Regenerate the listing and compare it with api/
        local-requires: [rust:$API_NIGHTLY]
        run: python3 scripts/api-snapshots.py check
      # Every public item of `ponko` has one path besides the prelude
      # (STABILITY.md, "The crate root and globs"): walks rustdoc's JSON,
      # built with the same nightly.
      - name: One public path per item
        local-requires: [rust:$API_NIGHTLY]
        run: |
          python3 scripts/check-naming.py --selftest
          python3 scripts/check-naming.py --paths
      # Only when the check failed: the regenerated files, for anyone who
      # cannot run the tool themselves.
      - name: Upload the regenerated listing
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-regenerated
          path: api-regenerated
          if-no-files-found: ignore

  book:
    local-os: [Linux, macOS, Windows]
    local-tags: [docs]
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache mdBook binary
        id: mdbook-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-${{ runner.arch }}-0.5.4
      - uses: taiki-e/install-action@v2
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        with:
          tool: mdbook@0.5.4
      - run: mdbook --version
        local-requires: [mdbook]
      # Every chapter and top-level module says how proven it is, and the
      # generated list of levels (book/src/maturity.md) is up to date.
      - name: Maturity levels
        run: |
          python3 scripts/maturity.py
          python3 scripts/maturity.py --selftest
      - run: mdbook build book
        local-requires: [mdbook]
      # The guide's inline Rust snippets: one `cargo check` of every block as a
      # module of a scratch crate (see book/src/contributing.md).
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: book-snippets
      - name: Compile the guide's Rust snippets
        run: python3 scripts/check-book-snippets.py

  miri:
    local-tags: [miri]
    name: Miri (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Miri interprets every instruction; tests shrink their sizes under
    # cfg(miri). The timeout catches a hang instead of blocking CI. The
    # stacked-borrows run is split three ways (about 25 minutes in one job on
    # a hosted runner), each part well under the timeout.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Our unsafe code under the strict model, without rayon, in three
          # parts run side by side (see the step below for what each holds).
          - name: ECS, stacked borrows, 1/3
            shard: 1
            args: --no-default-features --features derive
            flags: ""
          - name: ECS, stacked borrows, 2/3
            shard: 2
            args: --no-default-features --features derive
            flags: ""
          - name: ECS, stacked borrows, 3/3
            shard: 3
            args: --no-default-features --features derive
            flags: ""
          # The parallel path. rayon's dependency crossbeam-epoch trips Stacked
          # Borrows (not our code), and its global pool outlives main.
          # `changes` holds the parallel loops over rows picked by change filters,
          # `view_groups` the views that share a world across threads,
          # `query_cache` and `query_cache_views` the parallel loops and view
          # batches that find their archetypes through the query index,
          # `hooks` and `required` the component hooks and required components
          # (their commands are also recorded on several threads).
          - name: par_for_each, tree borrows
            args: --test parallel --test changes --test view_groups --test query_cache --test query_cache_views --test hooks --test required
            flags: -Zmiri-tree-borrows -Zmiri-ignore-leaks
          # The engine's unsafe code outside the ECS: the tests marked `miri`
          # in scripts/unsafe-inventory.txt (no GPU, window, audio device or
          # C library), as `check-unsafe.py --miri` lists them. Tree Borrows
          # for the same reason as the parallel path: rayon runs the threaded
          # draw-list fills and the hierarchy.
          - name: engine unsafe code, tree borrows
            engine: true
            flags: -Zmiri-tree-borrows -Zmiri-ignore-leaks
    env:
      MIRIFLAGS: ${{ matrix.flags }}
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Parts 1 and 2 take the slowest test files under Miri, by hand;
      # part 3 the library's unit tests and every other file in tests/, so
      # a new file is never left out. A file named here that's gone fails
      # the step.
      - name: cargo miri test
        env:
          SHARD: ${{ matrix.shard }}
          ARGS: ${{ matrix.args }}
          ENGINE: ${{ matrix.engine }}
        run: |
          if [ "$ENGINE" = true ]; then
            python3 scripts/check-unsafe.py --miri | while IFS= read -r line; do
              echo "$line"
              bash -c "$line" || exit 1
            done
            exit 0
          fi
          part1="archetype_alloc borrows_alloc differential views_alloc"
          part2="queries changes query_cache_differential commands_alloc"
          targets=()
          case "$SHARD" in
            1) for t in $part1; do targets+=(--test "$t"); done ;;
            2) for t in $part2; do targets+=(--test "$t"); done ;;
            3)
              targets+=(--lib)
              for f in crates/ponko_ecs/tests/*.rs; do
                t=$(basename "$f" .rs)
                case " $part1 $part2 " in
                  *" $t "*) ;;
                  *) targets+=(--test "$t") ;;
                esac
              done
              ;;
          esac
          # shellcheck disable=SC2086 # ARGS holds several flags
          cargo miri test -p ponko_ecs --no-fail-fast $ARGS "${targets[@]}"

  native:
    local-tags: [native]
    local-requires: [cmake, ctest, cbindgen]
    name: C and C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: native
      - name: Find the cbindgen version in Cargo.lock
        shell: bash
        run: echo "CBINDGEN_VERSION=$(awk '/^name = "cbindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      # Install just the generator and cache its binary. Running the FFI
      # example would compile and link the engine before reading its source.
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cbindgen@${{ env.CBINDGEN_VERSION }}
      - name: Verify generated C header
        shell: bash
        run: |
          mkdir -p target
          cbindgen --config crates/ponko_ffi/cbindgen.toml crates/ponko_ffi > target/ponko.generated.h
          python - <<'PYTHON'
          from pathlib import Path
          import difflib
          import sys
          # Git and cbindgen can produce different line endings on Windows.
          expected = Path("include/ponko.h").read_text().splitlines(keepends=True)
          actual = Path("target/ponko.generated.h").read_text().splitlines(keepends=True)
          sys.stdout.writelines(difflib.unified_diff(expected, actual, fromfile="checked in", tofile="generated"))
          sys.exit(expected != actual)
          PYTHON
      # control-env: the validation bundle step below drives the release C++
      # battle through PONKO_CONTROL, which a release build honors only with it.
      # webrtc: the C and C++ test programs run against a library with the
      # WebRTC endpoints (-DPONKO_WEBRTC=ON below); without the feature
      # tests/lobby.rs of ponko_ffi holds that the calls fail and name it.
      - run: cargo build -p ponko_ffi --release --features control-env,webrtc
      - name: Verify dynamic exports
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) library=target/release/ponko_ffi.dll ;;
            macOS) library=target/release/libponko_ffi.dylib ;;
            *) library=target/release/libponko_ffi.so ;;
          esac
          python3 scripts/test-native-symbols.py "$library"
      - run: cmake -S examples/cpp -B target/native -DCMAKE_BUILD_TYPE=Release -DPONKO_WEBRTC=ON "-DPONKO_LIBRARY_DIR=${{ github.workspace }}/target/release"
      - run: cmake --build target/native --config Release
      - run: ctest --test-dir target/native -C Release --output-on-failure
      # A C++ game through the validation bundle tool: started headless,
      # checked through the MCP tools, the bundle verified.
      - name: Validation bundle of the C++ battle
        if: runner.os != 'Windows'
        run: bash scripts/validation-bundle-native.sh target/native/ponko_cpp_battle

  # The C API under AddressSanitizer and UndefinedBehaviorSanitizer: the C and
  # C++ test programs built with both against a debug library, and the
  # ponko_ffi tests with the Rust side built with AddressSanitizer
  # (CONTRIBUTING.md, "Unsafe code and sanitizers"). One platform: macOS on
  # Apple silicon, where the commands were checked.
  sanitizers:
    local-tags: [native]
    local-requires: [cmake, ctest, target:nightly/aarch64-apple-darwin]
    name: C API sanitizers
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo build -p ponko_ffi --features control-env,webrtc
      - run: cmake -S examples/cpp -B target/native-asan -DCMAKE_BUILD_TYPE=Debug -DPONKO_SANITIZE=ON -DPONKO_WEBRTC=ON "-DPONKO_LIBRARY_DIR=${{ github.workspace }}/target/debug"
      - run: cmake --build target/native-asan
      - name: C and C++ test programs, ASan and UBSan
        env:
          ASAN_OPTIONS: detect_container_overflow=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir target/native-asan --output-on-failure
      - name: ponko_ffi tests, ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: cargo test -p ponko_ffi --target aarch64-apple-darwin --tests

  # The web build (wasm32): lint the browser-only code, and build the battle
  # demo the way the docs site does.
  web:
    local-tags: [web]
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: web
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --examples
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --lib --example web_smoke -- -D warnings
      - name: Clippy, browser control endpoint
        run: cargo clippy -p ponko --target wasm32-unknown-unknown --features web-control --lib --example web_smoke -- -D warnings
      # Image decoders work in the browser build too, with every format on.
      - run: cargo check -p ponko --target wasm32-unknown-unknown --features image-formats
      # The 3D examples (the 3D browser smoke fixture among them) need the feature.
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features 3d --examples
      # The tutorials' games (book/src/tutorial-*.md) need physics; they must
      # keep building for the browser.
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features physics,physics3d --example tutorial_2d --example tutorial_3d
      # Compressed textures build for the browser; Basis Universal (C++) is
      # left out there, so UASTC files are an Unsupported error on the web.
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features 3d,basis-universal
      # meshoptimizer (C++) is left out there too: meshopt-compressed glTF
      # files load on the web only from their uncompressed fallback.
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features 3d,gltf-meshopt
      # rustfft's WASM SIMD for the water spectrum, with simd128 for the whole
      # module (the feature refuses to compile without it, and that refusal
      # is checked too: the first command must fail on its message).
      - name: wasm-simd without simd128 is refused
        run: |
          if cargo check -p ponko --target wasm32-unknown-unknown --features 3d,wasm-simd --lib 2> target/wasm-simd-refused.txt; then
            echo "wasm-simd built without simd128" >&2; exit 1
          fi
          grep "needs the whole build compiled with SIMD" target/wasm-simd-refused.txt
      # In RUSTFLAGS, not CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: Cargo
      # reads only the first of the two that is set, and the environment at
      # the top sets RUSTFLAGS (web/build.sh --simd does the same).
      - name: Clippy, wasm-simd with simd128
        env:
          RUSTFLAGS: -D warnings -C target-feature=+simd128
        run: cargo clippy -p ponko --target wasm32-unknown-unknown --features 3d,wasm-simd --example web_spectrum -- -D warnings
      # The accessibility feature has no web adapter (AccessKit has none for
      # a canvas): it must build and do nothing.
      - run: cargo check -p ponko --target wasm32-unknown-unknown --features accessibility
      # Shaping works in the browser; system fonts build and report that the
      # web has none.
      - run: cargo check -p ponko --target wasm32-unknown-unknown --features system-fonts
      # The editor in the browser: Open and Save as ask for a path in a
      # field (no system dialog), and model thumbnails stay the software
      # ones (no offscreen readback or disk cache there).
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features editor -- -D warnings
      - run: cargo clippy -p ponko --target wasm32-unknown-unknown --features editor,3d -- -D warnings
      # The threaded web configuration (atomics, std rebuilt, nightly): the
      # nightly clippy has lints the stable one lacks, and some code is only
      # compiled with atomics. `web/build.sh --threads --clippy` lints the
      # engine and the threads fixture with the flags a threaded build uses.
      - name: Nightly Rust for the threaded web build
        local-skip: Install nightly with rust-src and the wasm target before the run.
        run: rustup toolchain install nightly --profile minimal --component rust-src,clippy --target wasm32-unknown-unknown
      - run: web/build.sh --threads --clippy
        local-requires: [component:nightly/rust-src, component:nightly/clippy, target:nightly/wasm32-unknown-unknown, wasm-bindgen]
      # The threaded fixture as the browser runner builds it (3D and the
      # benchmark internals), whose code only compiles with both.
      - run: web/build.sh --threads --clippy --features 3d,bench-internals
        local-requires: [component:nightly/rust-src, component:nightly/clippy, target:nightly/wasm32-unknown-unknown, wasm-bindgen]
      - name: Find the wasm-bindgen version in Cargo.lock
        run: echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - run: web/build.sh battle
        local-requires: [wasm-bindgen]

  # The browser runner's own tests (web/smoke/*.test.mjs): argument and
  # fixture handling, the supported/unsupported decisions, and that a browser
  # that can't start is reported as unsupported with its reason. No browser or
  # wasm build, so it runs on every pull request.
  web-smoke-runner:
    local-os: [Linux, macOS, Windows]
    local-tags: [web]
    local-requires: [node, npm]
    name: Web smoke runner tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --prefix web/smoke --no-audit --no-fund
      - run: node --test web/smoke/*.test.mjs web/gallery/*.test.mjs

  # Runs web builds in headless browsers (web/smoke/README.md): startup,
  # asset fetch, fixed-step progress, a click, a nonblank canvas, and the
  # adapter the engine itself reports. Three builds, each fixture from
  # web/smoke/fixtures.json: the 2D fixture, the 3D one (`--features 3d`) and
  # the complete-game reference. Chromium and WebKit run the WebGL2 path,
  # which must pass in each. Firefox is tried and reported: the runner's
  # headless Firefox has no WebGL2 (no GPU), so it passes as "unsupported"
  # there. GitHub's runners have no GPU, so WebGPU is
  # tried (headless shell and the full browser's new headless mode) and
  # reported: a browser that can't show a WebGPU canvas passes as
  # "unsupported" with the reason in its report and in the job summary, never
  # as a quiet pass; one that can must actually draw it.
  web-smoke:
    local-tags: [web]
    local-requires: [node, npm, wasm-bindgen]
    name: Web smoke test (headless browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: web-smoke
      - name: Find the wasm-bindgen version in Cargo.lock
        run: echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      # The browsers are about 500 MB: Playwright downloads only what this
      # cache lacks (the version is pinned by the lockfile).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/smoke/package-lock.json') }}
      - name: Install the runner and the browsers (Chromium with its headless shell, Firefox, WebKit)
        local-skip: Install the browsers and npm dependencies before the run (see CONTRIBUTING.md).
        run: |
          node --version
          npm ci --prefix web/smoke --no-audit --no-fund
          node web/smoke/node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - name: Runner tests
        run: node --test web/smoke/*.test.mjs web/gallery/*.test.mjs
      # The native lockstep players of the multiplayer step need ALSA and udev.
      - name: Install ALSA and udev headers (the native lockstep example)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        run: sudo apt-get install -y libasound2-dev libudev-dev
      # The platformer (examples/ember_hop) publishes its state like
      # coin_dash; its browser run is the web gallery's page check.
      - name: Build the fixtures (2D, 3D with --features 3d, the complete games)
        run: |
          web/build.sh web_smoke
          web/build.sh --features 3d web_smoke_3d
          web/build.sh --features text-shaping coin_dash
          web/build.sh --features physics ember_hop
          web/build.sh lights2d
          web/build.sh --features editor web_editor_save
          web/build.sh --features editor,3d web_editor_unloaded
          web/build.sh lockstep
          cargo build --example lockstep
          web/build.sh net_arena
          cargo build --example net_arena
      # Each browser step has its own deadline (a few minutes per run; a run
      # takes seconds), on top of the runner's own (a deadline on every
      # browser call and --run-timeout per run, failing as "browser-hang"
      # with the browser's last output): a browser that stops answering
      # fails its step instead of using up the job's hour.
      # Chromium, WebGL2 (WebGPU hidden, the fallback path).
      - name: Chromium, WebGL2, 2D fixture
        timeout-minutes: 5
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend webgl2 --chrome-trace
      - name: Chromium, WebGL2, browser control endpoint
        timeout-minutes: 5
        run: |
          cargo build -p ponko_mcp --bin ponko-mcp
          web/build.sh --features web-control web_smoke target/web/web-control
          node web/smoke/control.mjs target/web/web-control target/debug/ponko-mcp
      - name: Chromium, WebGL2, 3D fixture
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke_3d --browser chromium --backend webgl2
      # 2D lights (examples/lights2d): the light map, stencil shadows and
      # normal maps on WebGL2.
      - name: Chromium, WebGL2, 2D lights
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture lights2d --browser chromium --backend webgl2
      # Saving with the editor in a web build (examples/web_editor_save):
      # scenes it saves (a new one and one over a file the build ships) are
      # read back at once from the browser's storage; after a reload they
      # come back over the fetched files and the one over the build's file is
      # reverted; after another reload the revert held. Persistent storage is
      # asked for at the first save, not at start: run it once more with
      # `--persist granted` and with `--persist refused` (the runner answers
      # for the browser) to check the first load asks once and the reloads,
      # which save nothing, never ask. The editor's panel of glTF scenes that
      # didn't load, with its Retry, is the web_editor_unloaded fixture
      # (its own step below).
      - name: Chromium, WebGL2, editor saves kept in the browser
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_editor_save --browser chromium --backend webgl2
      # The same fixture with the browser granting the request for persistent
      # storage (the runner answers `navigator.storage.persist()`): the first
      # load's saves ask once and get a yes, the status bar's warning that
      # the browser may clear saves is gone, and the reloads, which save
      # nothing, never ask again and find the storage persistent.
      - name: Chromium, WebGL2, editor saves, persistent storage granted
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_editor_save --browser chromium --backend webgl2 --persist granted
      # And with the browser refusing it: the first save asks once, the answer
      # is a no, the warning stays (saves may be cleared when space runs
      # low), and the reloads never ask again.
      - name: Chromium, WebGL2, editor saves, persistent storage refused
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_editor_save --browser chromium --backend webgl2 --persist refused
      # The editor's panel of glTF scenes that didn't load (examples/
      # web_editor_unloaded, opened in edit mode on a scene whose post file
      # was replaced by a broken copy in the browser's storage): the scene
      # is left out and listed with why and a Retry; the runner asks the page
      # where the Retry button is (`<html data-ponko-retry>`, so the status
      # bar's layout can change) and clicks it; the post spawns where it was
      # saved and the yard's wall hangs off it again.
      - name: Chromium, WebGL2, editor, a glTF scene that didn't load and its Retry
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_editor_unloaded --browser chromium --backend webgl2
      # The complete-game reference (examples/coin_dash): its coin picture is
      # fetched and decoded, a click and keys reach it, and the screens it
      # reports follow them (play, pause, title, the retained-UI settings
      # screen, Escape closing it again; see fixtures.json). The web build
      # keeps no progress yet (no files in a browser).
      - name: Chromium, WebGL2, coin_dash (assets, a click, keys, screens)
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture coin_dash --browser chromium --backend webgl2
      # Browser multiplayer (web/smoke/multiplayer.mjs): the lockstep example
      # with two tabs joining a native host over WebSocket and a native client
      # over UDP; all four must reach the same world and see every player's
      # input, without a desync.
      - name: Chromium, multiplayer (two tabs and two native players, lockstep)
        timeout-minutes: 8
        if: ${{ !cancelled() }}
        run: node web/smoke/multiplayer.mjs --browser chromium
      # Failures while playing (web/smoke/runtime-failures.mjs): a panic after
      # startup, the game's own failure text and a lost WebGL2 context must
      # each reach the page. Uses the web_smoke build made above.
      - name: Chromium, failures after startup reach the page
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/runtime-failures.mjs
      # Key labels in a browser (web/smoke/key-labels.mjs): with a French
      # keyboard layout map, with no map and with a refused one, the labels
      # come from the map or are learned from key presses. Uses the web_smoke
      # build made above.
      - name: Chromium, key labels follow the keyboard layout map
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/key-labels.mjs
      # A WebGPU device lost while playing (the device-lost case): in the new
      # headless mode, where a WebGPU canvas presents, with software Vulkan.
      # A runner without a WebGPU adapter reports it unsupported.
      - name: Chromium, a lost WebGPU device reaches the page (new headless mode)
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: >-
          node web/smoke/runtime-failures.mjs --case device-lost --chromium-mode new
          --browser-arg --use-webgpu-adapter=swiftshader --allow-unsupported --out target/web-smoke/runtime-failures-webgpu
      # WebGPU first, WebGL2 as the fallback (web/smoke/webgpu-fallback.mjs,
      # the guide's "WebGPU first"): no navigator.gpu, no adapter, a device
      # that won't open and one lost as it opens must each end on WebGL2,
      # drawing, with one console line saying why. The 3D fixture built
      # above. The WebGPU run and the two cases faked on a real adapter are
      # unsupported where the runner has no WebGPU adapter.
      - name: Chromium, WebGPU first and each way back to WebGL2 (new headless mode)
        timeout-minutes: 8
        if: ${{ !cancelled() }}
        run: >-
          node web/smoke/webgpu-fallback.mjs --dir target/web/web_smoke_3d --chromium-mode new
          --browser-arg --use-webgpu-adapter=swiftshader --repeat 1
      # The water kit's CPU wave spectrum in the browser (web/smoke/spectrum.mjs,
      # the water guide's "On the web"): examples/web_spectrum.rs built plain,
      # with simd128 and with simd128 and wasm-simd, each timing every grid
      # size. Each build must say it was built as asked; the times go to the
      # report, never pass or fail.
      - name: Chromium, the water spectrum with and without WASM SIMD
        timeout-minutes: 30
        if: ${{ !cancelled() }}
        run: node web/smoke/spectrum.mjs --build --repeat 1
      # Video in the browser (web/smoke/video.mjs, the video guide's "In a
      # browser"): examples/web_video plays the test clip through
      # ponko::video::Video, decoded by the browser's own AV1 decoder
      # (WebCodecs); every frame shown must be the one its time names, at
      # most two frames behind, and two seeks while paused must show their
      # frames. A browser without WebCodecs AV1 exits 2 (unsupported).
      - name: Chromium, video through the browser's AV1 decoder
        timeout-minutes: 20
        if: ${{ !cancelled() }}
        run: node web/smoke/video.mjs --build
      # C and C++ games in the browser (web/smoke/cpp.mjs, the web guide's
      # "C and C++"): the guide's first C++ game built with web/build-cpp.sh
      # and the WASI SDK, which must start, fetch its texture, draw on WebGL2,
      # and move its crab while ArrowRight is held. The report has the module's size
      # and the startup time.
      - name: The WASI SDK (C and C++ for the web)
        local-skip: Install the WASI SDK before the run and set WASI_SDK_PATH.
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Chromium, the guide's C++ game (web/build-cpp.sh)
        local-requires: [env:WASI_SDK_PATH]
        timeout-minutes: 30
        if: ${{ !cancelled() }}
        run: node web/smoke/cpp.mjs --build
      # Threads on the web (web/smoke/threads.mjs, the guide's "Threads on the
      # web"): examples/web_threads built with `web/build.sh --threads`
      # (nightly Rust rebuilding std with atomics, hence rust-src). Served with
      # the cross-origin isolation headers its work must run on workers; served
      # without, on the page's thread alone, with the same result. A worker's
      # panic must stop the game. Fed browser gamepads must reach the game and
      # its rumble the pad's `vibrationActuator`, trigger rumble the pad whose
      # actuator lists `trigger-rumble` (`--case gamepads`; the same on the
      # ordinary build, `--case gamepads-plain`), and a warning must fail the
      # threaded build
      # (`--case warning`: an example whose only code is an unused function
      # behind `target_feature = "atomics"`, built with -D warnings). Built
      # with ponko-isolate.js and served WITHOUT the headers, the page must
      # reload once through the service worker and pass the isolated checks
      # (`--case service-worker`). Each small parallel pass must stay on the
      # page's thread below its web threshold, be shared out from it, and end
      # on the page's thread's result (`--case thresholds`); the default
      # threaded build must have the standard allocator and the build with
      # `--cfg ponko_web_thread_heaps` one heap per thread, each saving the
      # same JSON on the workers as on the page's thread (`--case allocator`).
      - name: Nightly Rust for the threaded web build
        local-skip: Install nightly with rust-src and the wasm target before the run.
        if: ${{ !cancelled() }}
        run: rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: Chromium, threaded web build (workers, the fallback without headers)
        local-requires: [component:nightly/rust-src, target:nightly/wasm32-unknown-unknown]
        timeout-minutes: 25
        if: ${{ !cancelled() }}
        run: |
          node web/smoke/threads.mjs --build
          node web/smoke/threads.mjs --case worker-panic
          node web/smoke/threads.mjs --case gamepads
          node web/smoke/threads.mjs --build --case gamepads-plain
          node web/smoke/threads.mjs --build --case service-worker
          node web/smoke/threads.mjs --case warning
          node web/smoke/threads.mjs --case thresholds
          node web/smoke/threads.mjs --build --case allocator
      # Replication in the browser (web/smoke/replication.mjs): the Orb Arena
      # example, a native dedicated server (no window) and one tab that joins
      # it over WebSocket. The tab must hold the server's orbs and its own
      # player and see an orb move.
      - name: Chromium, replication (a tab joins a native dedicated server and sees entities move)
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/replication.mjs --browser chromium
      # WebGPU: the headless shell, then the full browser's new headless mode
      # with software Vulkan (a WebGPU canvas is presented through its
      # compositor). Each passes only if it draws or is reported unsupported.
      - name: Chromium, WebGPU, headless shell
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend webgpu --allow-unsupported
      # Expected to fail on macOS, and only this way: the 3D fixture stalls
      # (`stall`). SwiftShader's first 3D frames there block the page for
      # 5 to 20 s on a busy machine (a page without the engine does the same
      # with slow frames), then it runs on at about 3 frames a second;
      # book/src/check-results/macos.md, 2026-11-26. Any other failure fails.
      - name: Chromium, WebGPU, new headless mode (2D and 3D fixtures)
        timeout-minutes: 8
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            out="target/web-smoke/webgpu-new-$fixture"
            node web/smoke/smoke.mjs --fixture "$fixture" --browser chromium --chromium-mode new --backend webgpu \
              --browser-arg --use-webgpu-adapter=swiftshader --allow-unsupported --out "$out" && continue
            if [ "$fixture" = web_smoke_3d ] && [ "$(uname)" = Darwin ] \
              && node -e 'process.exit(require(process.argv[1]).outcome.kind === "stall" ? 0 : 1)' "$PWD/$out/report.json"; then
              echo "expected on macOS: SwiftShader's first 3D frames block the page (book/src/check-results/macos.md)"
              continue
            fi
            status=1
          done
          exit $status
      - name: Chromium, whatever the engine picks
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend auto --allow-unsupported
      # WebKit: WebGL2 must pass; WebGPU is reported. Firefox: both are
      # reported. Headless Firefox has no WebGL2 on a runner without a GPU
      # (also with Mesa's software GL installed), so "unsupported" passes
      # here with its reason; anything else it does wrong still fails.
      - name: Firefox, WebGL2 (2D and 3D fixtures; reported where it has no WebGL2)
        timeout-minutes: 8
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            node web/smoke/smoke.mjs --fixture "$fixture" --browser firefox --backend webgl2 --allow-unsupported || status=1
          done
          exit $status
      - name: Firefox, WebGPU
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser firefox --backend webgpu --allow-unsupported
      # WebKit on Linux opens its audio output through GStreamer, which looks
      # for a sound server. Without one (as on a bare runner) WebKit's
      # content process crashes ("double free or corruption", after
      # GStreamer's PulseAudio device provider fails to connect) as soon as
      # a page asks an AudioContext for its output channels, which the
      # engine does when it opens its audio at a game's first click
      # (src/audio/web_output/browser.rs). A PulseAudio server with a null sink is the
      # runner's sound card, so the fixtures' music plays in WebKit too.
      - name: A sound server for WebKit (PulseAudio with a null sink)
        local-skip: Configure a PulseAudio null sink on the dedicated test host.
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --check || pulseaudio --daemonize=yes --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
          pactl info
      - name: WebKit, WebGL2 (2D and 3D fixtures)
        # Keep GStreamer diagnostics in browser.log.
        env:
          GST_DEBUG: "2"
        timeout-minutes: 8
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            node web/smoke/smoke.mjs --fixture "$fixture" --browser webkit --backend webgl2 || status=1
          done
          exit $status
      - name: WebKit audio with zero reported channels and a rejected resume
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: |
          status=0
          for mode in zero-channels resume-rejected; do
            env -u WEBKIT_GST_MAX_NUMBER_OF_AUDIO_OUTPUT_CHANNELS node web/smoke/smoke.mjs --fixture web_smoke --browser webkit --backend webgl2 --audio-output "$mode" || status=1
          done
          exit $status
      - name: WebKit, WebGPU
        # Keep GStreamer diagnostics in browser.log.
        env:
          GST_DEBUG: "2"
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/smoke.mjs --fixture web_smoke --browser webkit --backend webgpu --allow-unsupported
      # The runner itself: each broken build must be caught as that failure.
      - name: Self-tests (missing asset, startup panic, stalled simulation)
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: |
          for case in missing-asset panic stall; do
            node web/smoke/smoke.mjs --fixture web_smoke --browser chromium --backend webgl2 --case "$case"
          done
      # The web gallery (web/gallery/README.md) with two of its examples and a
      # demo that needs WebGPU, which must show its message on WebGL2: the
      # pages, their loader and the check the release runs on every example.
      # Also the 3D demos that read the scene depth (a lake, screen and target
      # effects) and a texture array's mipmaps, which need the renderer's
      # WebGL2 paths for them, and stencil materials (a depth with stencil
      # bits).
      - name: Web gallery pages (Chromium, WebGL2)
        timeout-minutes: 15
        if: ${{ !cancelled() }}
        run: |
          node web/gallery/build.mjs --only sprites,3d,compute,terrain,shaders,target_effect,stencil
          node web/smoke/gallery.mjs --browser chromium --backend webgl2
      # Every run, with what it asked for, what ran, the adapter the engine
      # reported and why anything was unsupported (also in the artifact).
      - name: Summary of every run
        if: ${{ !cancelled() }}
        run: node web/smoke/summary.mjs target/web-smoke
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-smoke
          path: target/web-smoke
          retention-days: 7

  # WebGPU gated on a real GPU (web/smoke/README.md, "On a real GPU"; the
  # web guide's "Frame times"). The web-smoke job above runs where there may
  # be no GPU, so its WebGPU steps may pass as "unsupported". There is no CI:
  # this job is the gate, run in the local check run on a maintainer's Mac,
  # where headless Chromium (the full browser's new headless mode) draws
  # with the machine's GPU through Metal. Every step here FAILS when WebGPU
  # is unsupported, when the browser or the engine is on a software renderer
  # (SwiftShader) or a fallback adapter, or when the engine fell back to
  # WebGL2 (`--require-gpu`, which also leaves out the software fallbacks).
  # The frame-times step reports the 3D fixture's frame times on WebGPU and
  # WebGL2 (median and 95th percentile; one load each here, the guide's
  # numbers are three) and fails on the same conditions.
  web-gpu:
    local-tags: [web, gpu]
    local-requires: [node, npm, wasm-bindgen]
    name: Web on a real GPU (headless Chromium, WebGPU and WebGL2)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install the runner and Chromium
        local-skip: Install the browsers and npm dependencies before the run (see CONTRIBUTING.md).
        run: |
          npm ci --prefix web/smoke --no-audit --no-fund
          node web/smoke/node_modules/playwright-core/cli.js install chromium
      - name: Build the fixtures (2D, 3D with --features 3d)
        run: |
          web/build.sh web_smoke
          web/build.sh --features 3d web_smoke_3d
      - name: Chromium, WebGPU on the GPU (2D and 3D fixtures, new headless mode)
        timeout-minutes: 8
        if: ${{ !cancelled() }}
        run: |
          status=0
          for fixture in web_smoke web_smoke_3d; do
            node web/smoke/smoke.mjs --fixture "$fixture" --browser chromium --chromium-mode new --backend webgpu \
              --require-gpu --out "target/web-smoke/gpu-$fixture-webgpu" || status=1
          done
          exit $status
      - name: Chromium, WebGL2 on the GPU (3D fixture, new headless mode)
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: >-
          node web/smoke/smoke.mjs --fixture web_smoke_3d --browser chromium --chromium-mode new --backend webgl2
          --require-gpu --out target/web-smoke/gpu-web_smoke_3d-webgl2
      - name: Frame times of the 3D fixture on the GPU (WebGPU and WebGL2)
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: node web/smoke/frame-times.mjs --repeat 1

  # The complete-game reference, packaged the way a player gets it and played
  # from an unrelated folder (`ponko package`, through
  # scripts/package-coin-dash.py for the walk-through; book/src/packaging.md):
  # the program, its assets, the licenses and the content and third-party
  # notices; then, on every OS, a headless walk-through (assets found outside
  # the checkout, saves, damaged-save recovery, the OS's default save folder,
  # missing assets failing loudly) and a walk-through in a real window. Linux
  # has no display or GPU: a virtual display and software Vulkan (lavapipe)
  # are installed and the window run must open a window there too. Windows
  # runners have no GPU: the step before the window run restricts wgpu to
  # DirectX 12 (WARP) when no real one is present. A window that can't open is a
  # failure on every OS; only the local `--allow-unsupported` run passes it.
  # The dev profile is packaged: the layout and notices are the release's, and
  # the dependencies are the ones the test jobs already built.
  package-smoke:
    local-tags: [test]
    name: Packaged game (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads), a virtual display with the X11 libraries a window loads, and software Vulkan
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev libudev-dev xvfb mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libxinerama1 libx11-xcb1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          # Linux and macOS read the `test` cache (same dev build, default
          # features) and never write it here. Windows has no cache of that kind
          # to share (`test-features` holds other feature builds), so it keeps
          # its own and does not overwrite anyone else's.
          save-if: ${{ github.ref == 'refs/heads/main' || runner.os == 'Windows' }}
          shared-key: ${{ runner.os == 'Windows' && 'package-smoke' || 'test' }}
      - name: The script's own checks (a crate without a license, window errors)
        run: python scripts/package-coin-dash.py selftest
      - name: Package
        run: python scripts/package-coin-dash.py package --profile dev --out target/package
      - name: Smoke test, headless (an unpacked copy, started from an unrelated folder)
        if: ${{ !cancelled() }}
        run: python scripts/package-coin-dash.py smoke --package target/package --mode headless
      # What players download from this OS (zip, an app in a dmg, tar.gz), made
      # and smoke-run by the generic command any game uses.
      - name: The host's download, with ponko package's own smoke run
        if: ${{ !cancelled() }}
        run: cargo run -p ponko_cli -- package --example coin_dash --features text-shaping --profile dev --out target/package-host
      # The engine reads WGPU_BACKEND (not WGPU_ADAPTER_NAME). With only DirectX 12
      # enabled, the one adapter left on a runner without a GPU is WARP, the
      # software renderer, which the engine accepts.
      - name: Windows without a GPU, use the software renderer (WARP) through DirectX 12
        local-skip: For hosts that need WARP, set WGPU_BACKEND=dx12 before running.
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name | Format-Table
          $real = Get-CimInstance Win32_VideoController | Where-Object { $_.Name -notmatch 'Basic Render|Remote Display|Hyper-V|Basic Display' }
          if (-not $real) {
            "WGPU_BACKEND=dx12" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "No GPU on this runner: DirectX 12 only, so wgpu picks WARP"
          }
      - name: Smoke test, in a window
        local-tags: [windowed]
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/package-coin-dash.py smoke --package target/package --mode window
          else
            python scripts/package-coin-dash.py smoke --package target/package --mode window
          fi
      # The platformer reference game (examples/ember_hop, feature physics):
      # its download with the command's own smoke run, then its walk-through
      # from the package, started from an unrelated folder with a data folder
      # of its own: both levels, leaving for the title, continuing the saved
      # run (a world save and load), the end screen and the progress file;
      # headless, then in a window.
      - name: The platformer's download, with ponko package's own smoke run
        if: ${{ !cancelled() }}
        run: cargo run -p ponko_cli -- package --example ember_hop --features physics --profile dev --out target/package-ember
      - name: The platformer's walk-through from its package (headless, then in a window)
        local-tags: [windowed]
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          dir=$(find target/package-ember -maxdepth 1 -type d -name 'ember-hop-*' | head -n 1)
          exe=$(find "$dir" -type f \( -name ember_hop -o -name ember_hop.exe \) | head -n 1)
          test -n "$exe" || { echo "no ember_hop program in $dir"; exit 1; }
          exe="$GITHUB_WORKSPACE/$exe"
          check() {
            python -c "import json, sys; r = json.load(open(sys.argv[1])); print(json.dumps(r)); ok = r['finished'] and r['levels_cleared'] == 2 and r['loads'] >= 1 and r['runs_finished'] == 1; sys.exit(0 if ok else 1)" "$1"
          }
          for mode in headless window; do
            work="$RUNNER_TEMP/ember $mode"
            mkdir -p "$work/elsewhere" "$work/data"
            cd "$work/elsewhere"
            if [ "$mode" = window ] && [ "$RUNNER_OS" = "Linux" ]; then
              PONKO_DATA_DIR="$work/data" xvfb-run -a "$exe" --smoke window --report report.json
            else
              PONKO_DATA_DIR="$work/data" "$exe" --smoke "$mode" --report report.json
            fi
            check report.json
            test -f "$work/data/ember-hop/progress.json"
            cd "$GITHUB_WORKSPACE"
          done

  # The reference validation bundles (book/src/validation-bundles.md): the
  # deliberately broken game and the corrected one, run in-process and as a
  # launched game driven through the MCP tools, verified and compared, then
  # published so a reviewer can open what a run observed. Headless.
  validation-bundles:
    local-tags: [test]
    name: Validation bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Reads the `test` cache (same dev build) and never writes it.
          save-if: false
          shared-key: test
      - name: Make, verify and compare the bundles
        run: bash scripts/validation-bundles.sh target/validation-bundles
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: validation-bundles
          path: target/validation-bundles
          retention-days: 14
          if-no-files-found: error

  # The `ponko new` templates (crates/ponko_cli/templates) against this
  # engine: the CLI's unit tests, then each template generated with
  # `--path .`, type-checked (the CLI's end-to-end test) and its own tests
  # run. Linux only. Template builds also catch changes to the engine itself.
  templates:
    local-tags: [test]
    name: Project templates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/templates
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install ALSA and udev headers (audio, gamepads)
        local-skip: Install system headers before the run (see CONTRIBUTING.md).
        run: sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: templates
      - name: The CLI's unit tests, each template generated and checked, and a new project packaged
        run: |
          cargo test -p ponko_cli
          cargo test -p ponko_cli --test new -- --ignored
          cargo test -p ponko_cli --test package -- --ignored
          cargo test -p ponko_cli --test server -- --ignored
      - name: Each template's own tests
        run: |
          cargo build -p ponko_cli
          cd "$RUNNER_TEMP"
          for kind in 2d 3d headless server; do
            "$CARGO_TARGET_DIR/debug/ponko" new "game-$kind" "--$kind" --path "$GITHUB_WORKSPACE"
            (cd "game-$kind" && cargo test)
          done

  # The dedicated-server template's container (crates/ponko_cli/templates/
  # server): its Dockerfile linted with hadolint, the server packaged with
  # `ponko package` against this engine, the image built from that package
  # (`PACKAGE_FROM=prebuilt`), started, joined by the example client, and
  # stopped with `docker stop`, which must end in a clean exit after the
  # goodbyes. Prints the image's size and the container's memory.
  server-container:
    local-tags: [test]
    local-requires: [docker]
    name: Server container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: server-container
      - name: Generate the server project and lint its Dockerfile
        run: |
          cargo build -p ponko_cli --no-default-features
          echo "PONKO=$GITHUB_WORKSPACE/target/debug/ponko" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/target/debug/ponko" new game-server --server --path "$GITHUB_WORKSPACE"
          docker run --rm -i hadolint/hadolint:v2.12.0 < game-server/Dockerfile
      - name: Package the server and build its image
        working-directory: ${{ runner.temp }}/game-server
        run: |
          "$PONKO" package --format folder --out target/server-package
          mv target/server-package/*/ package
          cargo build --example client
          docker build --build-arg PACKAGE_FROM=prebuilt -t game-server .
          docker image ls game-server --format 'image size: {{.Size}}'
      - name: Run it, join it with the example client, stop it
        working-directory: ${{ runner.temp }}/game-server
        run: |
          container=$(docker run -d -p 7777:7777/udp game-server)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for _ in $(seq 50); do
            docker logs "$container" 2>&1 | grep -q '"event":"server_start"' && break
            sleep 0.2
          done
          TICKS=90 target/debug/examples/client 127.0.0.1:7777
          docker stats --no-stream --format 'container memory: {{.MemUsage}}' "$container"
          docker stop "$container"
          docker logs "$container"
          docker logs "$container" | grep -q '"event":"player_joined"'
          docker logs "$container" | grep '"event":"server_stopped"' | grep -q '"reason":"terminate"'
          code=$(docker inspect -f '{{.State.ExitCode}}' "$container")
          echo "exit code: $code"
          test "$code" = 0
