[package]
name = "ponko_mcp"
version = "0.1.0"
keywords = ["mcp", "gamedev", "agents", "ai"]
categories = ["game-development", "development-tools"]
documentation = "https://docs.rs/ponko_mcp/"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server that lets AI agents inspect and drive running Ponko games"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "ponko-mcp"
path = "src/main.rs"

[dependencies]
ponko_image_diff = { path = "../ponko_image_diff", version = "0.1.0" }
serde_json = "1.0.154"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The local browser bridge uses the same WebSocket implementation as the engine.
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
data-encoding = "2.11.1"
getrandom = "0.4"
tempfile = "3.27.0"

[dev-dependencies]
# `3d` for the scene editing session (tests/scene_editing.rs).
ponko = { path = "../..", version = "0.1.0", features = ["3d"] }
serde = { version = "1.0.229", features = ["derive"] }
