[package]
name = "ponko_mcp"
version = "0.1.0"
keywords = ["mcp", "gamedev", "agents", "ai"]
categories = ["game-development", "development-tools"]
documentation = "https://docs.rs/ponko_mcp/"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server that lets AI agents inspect and drive running Ponko games"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "ponko-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.154"

[dev-dependencies]
# `3d` for the scene editing session (tests/scene_editing.rs).
ponko = { path = "../..", version = "0.1.0", features = ["3d"] }
serde = { version = "1.0.229", features = ["derive"] }
