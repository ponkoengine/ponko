[package]
name = "ponko_bench"
default-run = "ponko_bench"
version = "0.1.0"
# A workspace tool, not a library: never published.
publish = false
description = "Benchmarks: ponko_ecs vs hecs, and simulation at scale (other engines: bench/compare)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ponko_ecs = { path = "../../crates/ponko_ecs" }
ponko = { path = "../..", default-features = false, features = ["physics", "physics3d", "navmesh", "bench-internals", "mods-wasm"] }
# The code mod benchmark writes its module as text (the version the
# engine's tests use, on the wasmparser wasmi uses).
wat = "=1.228.0"
rapier2d = "0.36.1"
rapier3d = "0.36.1"
rayon = "1.12.0"
hecs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The rendering baseline's report (the engine already depends on it).
serde_json = "1.0.154"
# The save benchmark's components (`--bin saves`).
serde = { version = "1.0.229", features = ["derive"] }

# The thread CPU clock of the streaming benchmark (wall time elsewhere).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
render = ["ponko/window"]
# The positional sound benchmark (`audio3d/...`): Kira, mixing offline.
audio = ["ponko/audio", "ponko/3d"]
# The text benchmarks' shaped cases, and the ASCII case with shaping
# compiled in (its cost must match the build without it).
text-shaping = ["ponko/text-shaping"]
# rapier's documented performance features (`compare/physics-10k` in the
# scoreboard's tuned table, the same on Bevy's side). Ponko has no feature
# of its own for them: naming rapier2d with these features, as here, turns
# them on for the engine's rapier too (Cargo unifies a crate's features).
rapier-parallel = ["rapier2d/parallel"]
rapier-simd8 = ["rapier2d/simd8"]
# The video benchmark (`video/frame`): decoding a clip named by
# PONKO_BENCH_VIDEO.
video = ["ponko/video"]

[[bin]]
name = "instances"
path = "src/bin/instances.rs"
required-features = ["render"]

[[bin]]
name = "first_frame"
path = "src/bin/first_frame.rs"
required-features = ["render"]

[[bin]]
name = "characters"
path = "src/bin/characters.rs"

[[bin]]
name = "saves"
path = "src/bin/saves.rs"

[[bin]]
name = "replication"
path = "src/bin/replication.rs"

[[bin]]
name = "render_compare"
path = "src/bin/render_compare.rs"
