<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · Ponko</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #14161b; color: #d6d9e0;
                 font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
    /* The game fills the page; winit reports the size to the game. */
    canvas#ponko { display: block; width: 100vw !important; height: 100vh !important; outline: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
    #status.error { color: #ff8a80; padding: 2em; text-align: center; }
    #crash-report:not([hidden]) { position: fixed; left: 0; right: 0; bottom: 2em; text-align: center; color: #9ecbff; }
  </style>
</head>
<body>
  <canvas id="ponko" tabindex="0"></canvas>
  <div id="status" role="status">Loading…</div>
  <a id="crash-report" hidden>Save the crash report</a>
  <script type="module">
    import init, * as game from "./game.js";
    const status = document.getElementById("status");
    const canvas = document.getElementById("ponko");
    // The status line leaves the page once the game runs; a failure brings it back.
    let statusShown = true;
    // The first failure is the one shown: what follows it (the trap after a
    // panic) says less.
    let stopped = false;

    function showError(message) {
      if (!statusShown) {
        document.body.append(status);
        statusShown = true;
      }
      status.className = "error";
      status.textContent = message;
    }

    function started(error) {
      if (error) {
        stopped = true;
        showError("Could not start the game: " + (error.message ?? String(error)));
      } else if (status.className !== "error") {
        status.remove();
        statusShown = false;
        canvas.focus();
      }
    }

    // A panic, the WebGL2 context lost while playing, a worker thread that
    // stopped: `text` is the game's own words for it, when it has some.
    function failed(failure) {
      if (stopped) return;
      stopped = true;
      showError(failure.text ?? "The game stopped: " + (failure.message ?? String(failure)));
    }

    window.addEventListener("error", (e) => {
      if (stopped) return;
      stopped = true;
      showError("The game stopped: " + e.message + " (see the browser console)");
    });

    async function start() {
      try {
        await init();
      } catch (e) {
        // winit transfers control to the browser with this exception.
        if (!String(e).includes("Using exceptions for control flow")) {
          // A synchronous engine error may have been reported before init threw.
          let engineError;
          try {
            game.onPonkoStartup?.((error) => { engineError = error; });
            // A panic before the event loop started.
            game.onPonkoFailure?.(failed);
          } catch {
            // The Wasm module could not be loaded.
          }
          if (!stopped) started(engineError ?? e);
          console.error(e);
          return;
        }
      }
      // Packages can also use game.js from older engine versions.
      game.onPonkoFailure?.(failed);
      if (game.onPonkoStartup) game.onPonkoStartup(started);
      else started(null);
    }
    start().catch((e) => {
      started(e);
      console.error(e);
    });
  </script>
  <script id="crash-report-script">
    // A crash report (`ponko::crash`): offer it as a file the player can
    // send. It comes as an event, and stays in `window.ponkoCrashReport`.
    (() => {
      function offer(report) {
        const link = document.getElementById("crash-report");
        if (!link || !report || typeof report.text !== "string") return;
        link.href = URL.createObjectURL(new Blob([report.text], { type: "text/plain" }));
        link.download = String(report.name ?? "crash-report.txt").split("/").pop();
        link.hidden = false;
      }
      window.addEventListener("ponkocrashreport", (e) => offer(e.detail));
      if (window.ponkoCrashReport) offer(window.ponkoCrashReport);
    })();
  </script>
</body>
</html>
