[package]
name = "ponko_cli"
version = "0.1.0"
description = "The `ponko` command: new Ponko game projects from templates (2D, 3D, headless), distributable packages of a game, cooked assets and GPU-compressed textures"
keywords = ["gamedev", "cli", "template", "packaging"]
categories = ["game-development", "command-line-utilities", "development-tools"]
documentation = "https://ponko.dev/guide/getting-started.html"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# The templates are files of this package (crates.io gets only its own
# folder), embedded into the binary. They are also cargo-generate templates:
# their manifests are `Cargo.toml.liquid`, since a folder with a `Cargo.toml`
# would be left out of the package.

[[bin]]
name = "ponko"
path = "src/main.rs"
# Its docs would overwrite the engine library's (both are `ponko`) in a
# workspace `cargo doc`; the command has no API, its guide is the book.
doc = false

# A few small dependencies, never the engine, so `cargo install ponko_cli`
# stays quick. `ponko package` reads `cargo metadata` (JSON: serde_json,
# without serde's derive macros) and writes zip and tar.gz archives itself
# (deflate and gzip: flate2 on its pure-Rust backend; zip checksums:
# crc32fast), so packaging needs no `zip` or `tar` program on any OS.
[dependencies]
ponko_image_diff = { path = "../ponko_image_diff", version = "0.1.0" }
serde_json = "1.0.154"
flate2 = "1.1.10"
crc32fast = "1.5.0"
# `ponko textures` (feature `textures`, on by default): Basis Universal's
# UASTC encoder and transcoder (C++, built with the system's compiler; the
# one Rust crate that binds both), the image decoders for PNG and JPEG
# sources, and KTX2 headers and Zstandard written with the same pure-Rust
# crates the engine reads them with. `--no-default-features` leaves them
# out for a quicker `cargo install`.
basis-universal = { version = "0.3.1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
ktx2 = { version = "0.5.0", optional = true }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"], optional = true }
# `ponko cook`: content hashes of the cache (SHA-256, the RustCrypto crate
# the engine's tree already builds), meshoptimizer for glTF meshes (feature
# `meshes`: C++, the crate the engine's `gltf-meshopt` decoder uses) and
# naga's WGSL front end and validator for shaders (feature `shaders`: the
# version wgpu uses). Sounds are encoded to FLAC by its own code.
sha2 = "0.10.9"
meshopt = { version = "0.7.0", optional = true }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"], optional = true }
# `ponko cook` reads Aseprite files (feature `aseprite`) with
# aseprite-loader: pure Rust, no unsafe code, MIT OR Apache-2.0, maintained
# (0.4.2, February 2026), and it composites frames with Aseprite's blend
# modes. Its PNG output uses `image`, as textures do.
aseprite-loader = { version = "0.4.2", optional = true }

[dev-dependencies]
# Decodes the BCn blocks `ponko textures` writes, to compare with the source.
texture2ddecoder = "0.1.2"
# Decodes the FLAC files `ponko cook` writes, as the engine plays them.
symphonia = { version = "0.6.1", default-features = false, features = ["flac"] }

[features]
default = ["textures", "meshes", "shaders", "aseprite"]
textures = ["dep:basis-universal", "dep:image", "dep:ktx2", "dep:ruzstd"]
# `ponko cook` optimizes glTF meshes (vertex cache, overdraw, vertex fetch).
meshes = ["dep:meshopt"]
# `ponko cook` validates WGSL shaders as the engine composes them.
shaders = ["dep:naga"]
# `ponko cook` turns Aseprite files into the sheet and JSON the engine loads.
aseprite = ["dep:aseprite-loader", "dep:image", "image/png"]
