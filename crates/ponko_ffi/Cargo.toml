[package]
name = "ponko_ffi"
version = "0.1.0"
description = "C API for Ponko (include/ponko.h); include/ponko.hpp wraps it for C++17."
keywords = ["gamedev", "ffi", "c", "cpp"]
categories = ["game-engines", "api-bindings"]
documentation = "https://docs.rs/ponko_ffi/"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[package.metadata.docs.rs]
# The C ABI with every feature, so every function shows.
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["audio", "window", "inspector", "gamepad", "physics", "physics3d", "text-shaping"]
# A window and GPU rendering. Off: ponko_game_run fails with an error and
# only headless runs work, from a build half the size.
window = ["ponko/window"]
# Sound through the engine's audio feature. Off: sound calls succeed silently.
audio = ["ponko/audio"]
# The runtime inspector overlay (backquote key); see ponko_game_inspector.
inspector = ["ponko/inspector"]
# Gamepads (ponko_ctx_gamepad_*). Off: no pads are ever connected.
gamepad = ["ponko/gamepad"]
# Screen readers read and operate the retained UI of the game's window
# (macOS, Windows and Linux; builds and does nothing on the web). Off by
# default.
accessibility = ["window", "ponko/accessibility"]
# 2D physics with rapier (ponko_game_physics, rigid bodies, colliders, rays).
# Off: those calls fail with an error.
physics = ["ponko/physics"]
# 3D physics with rapier (ponko_game_physics3d, 3D bodies, colliders, a
# character controller, ray and shape queries). Off: those calls fail with an
# error.
physics3d = ["ponko/physics3d"]
# KTX2 and DDS block-compressed textures through ponko_ctx_load_texture and
# the other texture loaders (the guide's "Compressed textures"). Off: such
# files fail with an unsupported error naming the feature.
compressed-textures = ["ponko/compressed-textures"]
# Basis Universal UASTC files too, transcoded at load (C++, built with the
# system's compiler).
basis-universal = ["compressed-textures", "ponko/basis-universal"]
# Text shaping: Arabic, Devanagari and other joined scripts, right-to-left
# and mixed-direction lines, ligatures (ponko_ctx_set_text_shaping). Off:
# text is laid out character by character; fallback chains still work.
text-shaping = ["ponko/text-shaping"]
# The computer's fonts on desktop: ponko_ctx_try_load_system_font and
# ponko_ctx_set_system_font_fallback. Off by default; off, those report
# that system fonts are unsupported.
system-fonts = ["text-shaping", "ponko/system-fonts"]
# Lets a release build honor PONKO_CONTROL=1 (debug builds always do). Off:
# a release build opens the control endpoint only after
# ponko_game_control_endpoint(game, true).
control-env = ["ponko/control-env"]
# Networking and lobbies over Steam. Off by default: it
# links libsteam_api, which then ships next to the game. Off: those calls
# fail with an error.
steam = ["ponko/steam"]

[dependencies]
# The C API exports its 3D and navigation functions unconditionally, so the
# engine's `3d` and `navmesh` features are always on here, even with
# --no-default-features (glTF and Recast stay in every C build). Making them
# optional would change the native interface; scripts/feature-deps.sh checks
# that nothing else optional is forced on.
ponko = { path = "../..", version = "0.1.0", default-features = false, features = ["3d", "navmesh"] }
ponko_ecs = { path = "../ponko_ecs", version = "0.1.0" }
rayon = "1.12.0"
serde_json = "1.0.154"

[dev-dependencies]
cbindgen = { version = "0.29.2", default-features = false }
