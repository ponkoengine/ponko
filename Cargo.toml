[package]
name = "ponko"
version = "0.1.0"
description = "A code-first 2D and 3D game engine with integrated simulation, C++ bindings, and tools for AI-assisted development."
keywords = ["gamedev", "engine", "2d", "3d", "ecs"]
categories = ["game-engines", "game-development", "simulation"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ponko/"
# What the published crate holds: the engine's sources and build script, the
# Rust examples with the assets they load, and the license and policy files.
# Not the guide, CI, scripts, tests (they need the workspace), the web shell,
# the C/C++ side (the headers ship with the release archives), the benchmark
# scenes or the logo.
include = [
    "/src/**",
    "/build.rs",
    "/examples/**",
    "!/examples/cpp/**",
    "/assets/**",
    "!/assets/branding/**",
    "/README.md",
    "/CHANGELOG.md",
    "/STABILITY.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[package.metadata.docs.rs]
# Everything public. Left out: `hotpatch` (a dev tool, no API) and
# `bench-internals` (unstable, not part of the API).
features = ["physics", "physics3d", "physics-determinism", "steam", "3d", "navmesh", "accessibility", "control-env", "profiling"]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]


# What `ponko package --example coin_dash` puts in the reference game's
# package (book/src/packaging.md). The engine itself is a library: only its
# example games have packages.
[package.metadata.ponko.examples.coin_dash]
name = "Coin Dash"
id = "dev.ponko.coin-dash"
assets = ["assets/coin_dash"]
files = [
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "NOTICE",
    "examples/coin_dash/CONTENT-NOTICES.txt",
    { from = "examples/coin_dash/PACKAGE-README.txt", to = "README.txt" },
]

# The 3D reference game, a third-person game (book/src/shard-grove.md):
# `ponko package --example shard_grove --features navmesh,physics3d`.
[package.metadata.ponko.examples.shard_grove]
name = "Shard Grove"
id = "dev.ponko.shard-grove"
assets = ["assets/shard_grove"]
files = [
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "NOTICE",
    "examples/shard_grove/CONTENT-NOTICES.txt",
    { from = "examples/shard_grove/PACKAGE-README.txt", to = "README.txt" },
]

# The tutorials' games (book/src/tutorial-2d.md, tutorial-3d.md), packaged
# with `ponko package --example tutorial_2d --features physics` (or
# `tutorial_3d --features physics3d`), or for the web with `--web`.
[package.metadata.ponko.examples.tutorial_2d]
name = "Crab Cove"
id = "dev.ponko.crab-cove"
assets = ["assets/tutorial_2d"]
files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]

[package.metadata.ponko.examples.tutorial_3d]
name = "Lantern Yard"
id = "dev.ponko.lantern-yard"
assets = ["assets/tutorial_3d"]
files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]

# The second reference game, a platformer (book/src/ember-hop.md):
# `ponko package --example ember_hop --features physics`.
[package.metadata.ponko.examples.ember_hop]
name = "Ember Hop"
id = "dev.ponko.ember-hop"
assets = ["assets/ember_hop"]
files = [
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "NOTICE",
    "examples/ember_hop/CONTENT-NOTICES.txt",
    { from = "examples/ember_hop/PACKAGE-README.txt", to = "README.txt" },
]

[dependencies]
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
navmesh-rs = { version = "0.2.1", optional = true, default-features = false, features = ["std", "libm", "recast", "detour", "crowd", "tilecache", "polyref64"] }
renet = "2.0.0"
ponko_ecs = { path = "crates/ponko_ecs", version = "0.1.0", features = ["serde", "derive"] }
half = { version = "2.7.1", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.34.2", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
wgpu = { version = "30.0.1", optional = true, features = ["glsl"] }
winit = { version = "0.30.13", optional = true }
puffin = { version = "0.20.0", optional = true }
puffin_http = { version = "0.17.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rayon = "1.12.0"
rapier2d = { version = "0.36.1", optional = true }
rapier3d = { version = "0.36.1", optional = true }
fontdue = "0.9.5"
epaint_default_fonts = "0.37.0"
# Text shaping (feature `text-shaping`): the HarfBuzz project's Rust port
# (the shaper egui's inspector already brings in), Unicode bidirectional
# ordering, line-break opportunities and scripts. fontdue keeps rasterizing.
harfrust = { version = "0.12.0", optional = true }
unicode-bidi = { version = "0.3.18", optional = true }
unicode-linebreak = { version = "0.1.5", optional = true }
unicode-script = { version = "0.5.9", optional = true }
# Character coverage of system fonts (feature `system-fonts`); the font
# parser harfrust is built on.
read-fonts = { version = "0.41.0", default-features = false, features = ["std"], optional = true }
kira = { version = "0.12.6", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm", "mp3", "flac"], optional = true }
# Kira's decoders (its formats turn them on), used directly to stream on the
# web, where Kira's decoder thread can't run: already built for Kira.
symphonia = { version = "0.6.1", default-features = false, optional = true }
egui = { version = "0.37", default-features = false, features = ["default_fonts"], optional = true }
egui-wgpu = { version = "0.37", default-features = false, optional = true }
egui-winit = { version = "0.37", default-features = false, optional = true }
subsecond = { version = "0.7.10", optional = true }
dioxus-devtools = { version = "0.7.10", default-features = false, optional = true }
# `Instant` that also works in browsers; on desktop it is std's own type.
web-time = "1.1.0"
gilrs = { version = "0.11.2", optional = true }
steamworks = { version = "0.13.1", optional = true }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"], optional = true }
# Level files from level editors (`ponko::tilemap`): `quick-xml` reads
# Tiled's XML maps (`.tmx`) and tilesets; `flate2` unpacks their zlib and
# gzip tile data. Both are small, and `flate2` is already in every build
# (PNG decoding uses it).
quick-xml = { version = "0.41.0", default-features = false }
flate2 = "1.1.10"
# Accessibility tree data types (feature `accessibility`); the same crate
# and version the inspector's egui already brings in.
accesskit = { version = "0.25.2", optional = true }
# Block-compressed textures (feature `compressed-textures`), all pure Rust
# so they build for the web too: `ktx2` reads KTX2 containers (no
# dependencies of its own), `ruzstd` unpacks their Zstandard
# supercompression, and `texture2ddecoder` decodes BCn, ETC2 and ASTC
# blocks on the CPU for a GPU that can't sample them.
ktx2 = { version = "0.5.0", optional = true }
ruzstd = { version = "0.9.1", optional = true, default-features = false, features = ["std"] }
texture2ddecoder = { version = "0.1.2", optional = true }

# Waits for the GPU on desktop (feature `window`); the web build awaits it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "1.0.1", optional = true }
# Basis Universal's UASTC transcoder (feature `basis-universal`): the C++
# library, built with the system's C++ compiler. Not on the web: it can't be
# built for wasm32-unknown-unknown, so a web build of the feature reads
# every other compressed texture and reports UASTC files as unsupported.
basis-universal = { version = "0.3.1", optional = true }

# The system's fonts by family name and coverage (feature `system-fonts`):
# desktop only, the web has no font files to read.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.fontdb]
version = "0.24.0"
optional = true
default-features = false
features = ["std", "fs", "memmap"]

[target.'cfg(any(unix, windows))'.dependencies]
libc = "0.2"
# The control endpoint's token: the OS's secure random source.
getrandom = "0.4"

# The screen-reader adapter (feature `accessibility`): AccessKit's adapter
# for each desktop system, which answers the system's accessibility queries
# for the game's window from the same tree. The `accesskit` data types
# themselves are in [dependencies]. macOS: `NSAccessibility` on the
# window's view.
[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.2", optional = true }

# Windows: UI Automation (Narrator, NVDA, JAWS) on the window's HWND. Its
# `windows` crate is the release wgpu already brings in.
[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35.2", optional = true }

# Linux and the BSDs: AT-SPI over D-Bus (Orca). Pure Rust (zbus); it runs
# its own small executor thread, so the engine needs no async runtime.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
accesskit_unix = { version = "0.24.1", optional = true }

# The web build (wasm32): the browser APIs for the canvas and fetching
# assets, and WebGL2 for browsers without WebGPU.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", optional = true, features = ["webgl"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
# Sound through WebAudio (kira plays through cpal).
cpal = { version = "0.18.2", features = ["wasm-bindgen"], optional = true }
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Response", "console", "Event", "HtmlElement", "HtmlTextAreaElement", "CssStyleDeclaration", "CompositionEvent", "InputEvent", "KeyboardEvent", "EventTarget", "Node", "DomRect", "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode"] }

# The validation bundle example drives a launched game through the MCP
# server's tools, in-process. Path only (no version): the MCP crate's tests
# depend on the engine, and a published cycle between the two can't resolve.
[dev-dependencies]
ponko_mcp = { path = "crates/ponko_mcp" }
# The renderer's tests translate its shaders to GLSL ES 3.0, as wgpu does for
# WebGL2 (src/render/gpu3d/webgl2_shaders_test.rs). The naga wgpu already uses.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }

# The native accessibility test (tests/ui_access_macos.rs) asks an `NSView`
# what a screen reader would ask it. The same objc2 versions AccessKit's
# macOS adapter uses.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSString", "NSValue"] }

# The Windows accessibility test (tests/ui_access_platforms.rs) is a UI
# Automation client of the adapter, on a window that is never shown: the
# `windows` release AccessKit's adapter and wgpu already use.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

# The Linux accessibility test (tests/ui_access_platforms.rs) reads the
# adapter over the AT-SPI bus like a screen reader: the same proxies, zbus
# and async-io the adapter itself uses.
[target.'cfg(target_os = "linux")'.dev-dependencies]
atspi-proxies = { version = "0.13.0", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
async-io = "2.6.0"

# The browser smoke fixture (examples/web_smoke.rs) reports its state to
# the page; the engine already depends on web-sys there.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "Location"] }

[features]
# Unstable benchmark drivers for `crates/ponko_bench` (`ponko::render::SceneBench`,
# `LodBench`, `RecordBench`, `ExtractionBench`). Not part of the public API:
# they change without notice in any release.
bench-internals = []
# Pure Rust Recast baking and Detour queries; no window, Bevy or async runtime.
navmesh = ["3d", "dep:navmesh-rs"]
default = ["audio", "window", "inspector", "gamepad", "image-jpeg"]
# A window and GPU rendering (winit + wgpu). Off: `Game::run_headless` only,
# for simulation servers and CI; drawing calls do nothing, `Game::run` panics.
window = ["dep:wgpu", "dep:winit", "dep:pollster"]
# Sound with kira. Off: the sound API stays and is silent (for servers).
audio = ["dep:kira", "dep:cpal", "dep:symphonia"]
# The runtime inspector (egui overlay, toggled with the ` key): entities and their
# components with live editing, resources, system timings, sim controls.
# Off: no egui in the build.
inspector = ["window", "dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
# Screen-reader support for the retained UI (`ctx.ui`): roles, names, values
# and focus are given to the system's accessibility API, and its requests
# (press, focus, set value) reach the UI. macOS (VoiceOver), Windows (UI
# Automation: Narrator, NVDA) and Linux (AT-SPI: Orca); on the web the
# feature builds and does nothing. Off: no adapter;
# `Ui::accessibility_tree` and `UiAccessTracker` are always there.
accessibility = ["window", "dep:accesskit", "dep:accesskit_macos", "dep:accesskit_windows", "dep:accesskit_unix"]
# Gamepads through gilrs (Xbox, PlayStation, Switch and other controllers).
# Off: `ctx.input.gamepads()` is always empty. On Linux it needs libudev headers.
gamepad = ["window", "dep:gilrs"]
# Lets a release build honor `PONKO_CONTROL=1` (debug builds always do), for
# tools that launch release builds, such as ponko-mcp's `launch`. Off: a
# release build opens the control endpoint only if the game asks for it with
# `Game::control_endpoint(true)`, so a shipped game never opens a port.
control-env = []
# Frame profiler: per-system scopes, viewable live with `puffin_viewer`
# (cargo install puffin_viewer; connects to 127.0.0.1:8585).
profiling = ["dep:puffin", "dep:puffin_http"]
# Hot-patch system code while the game runs, keeping all its state: run
# with Dioxus's CLI, `dx serve --hot-patch --features hotpatch` (see the
# guide's "Changing code while the game runs" chapter). Off: systems are called directly.
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]
# 2D physics with rapier: `Game::physics`, the RigidBody / Collider /
# Velocity components, collision events and ray casts. Off: no rapier in the build.
physics = ["dep:rapier2d"]
# 3D physics with rapier: `Game::physics3d`, the RigidBody3D / Collider3D /
# Velocity3D / Character3D components, collision events, ray and shape
# queries, a character controller. Off: no rapier3d in the build.
physics3d = ["3d", "dep:rapier3d"]
# Networking over Steam (`Net` and `NetMessages`): Steam's relays
# and lobbies, so friends join from the overlay. Re-exports `steamworks`.
# Ship the Steamworks redistributable (libsteam_api) next to the game.
steam = ["dep:steamworks"]
# Physics that gives bit-identical results on every platform (for lockstep
# networking and replays), a little slower: rapier's enhanced-determinism
# (for 3D physics too, when `physics3d` is on).
physics-determinism = ["physics", "rapier2d/enhanced-determinism", "rapier3d?/enhanced-determinism"]

# 3D: meshes, materials, glTF models, a perspective camera and sun light,
# drawn under the 2D layer (`Transform3D`, `Model`, `ctx.scene3d`).
# Off: no 3D pass, no glTF loader in the build.
3d = ["dep:gltf", "dep:half", "image-jpeg", "image-hdr", "image-exr"]

# Text shaping with harfrust: ligatures and kerning from the font's
# OpenType tables, complex scripts (Arabic joining, Devanagari), right-to-left
# and mixed-direction lines, and line breaks that follow Unicode's rules.
# ASCII strings keep the per-character fast path unless
# `Graphics::set_text_shaping(TextShaping::Always)`. Off: text is laid out
# character by character, as before; font fallback chains still apply.
text-shaping = ["dep:harfrust", "dep:unicode-bidi", "dep:unicode-linebreak", "dep:unicode-script"]
# The system's fonts on desktop: `Graphics::load_system_font` by family name
# and `set_system_font_fallback`, which finds a system font for characters
# no loaded font has. Off (and on the web): those calls report `Unsupported`.
system-fonts = ["text-shaping", "dep:fontdb", "dep:read-fonts"]

# Image formats `load_texture` and the other texture loaders can read, chosen
# without the `3d` feature. PNG is always built in (screenshots are PNG files).
# The format of a file is found from its first bytes, so a JPEG named
# `.png` still loads; a file in a format that is left out fails with an
# `Unsupported` error that names the feature to enable.
# JPEG, on by default (photos, backgrounds). `3d` needs it for glTF textures.
image-jpeg = ["image/jpeg"]
# WebP, lossy and lossless.
image-webp = ["image/webp"]
# BMP.
image-bmp = ["image/bmp"]
# TGA (no magic bytes: found from the `.tga` extension).
image-tga = ["image/tga"]
# GIF (the first frame).
image-gif = ["image/gif"]
# TIFF.
image-tiff = ["image/tiff"]
# Windows icons (`.ico`).
image-ico = ["image/ico"]
# QOI.
image-qoi = ["image/qoi"]
# PNM (`.pbm`, `.pgm`, `.ppm`, `.pam`).
image-pnm = ["image/pnm"]
# DDS (the formats the image crate decodes, not the GPU-compressed ones).
image-dds = ["image/dds"]
# Radiance HDR; loaded as 8-bit color. `3d` turns it on for environment maps.
image-hdr = ["image/hdr"]
# OpenEXR; loaded as 8-bit color. `3d` turns it on for environment maps.
image-exr = ["image/exr"]
# Every format above.
image-formats = [
    "image-jpeg",
    "image-webp",
    "image-bmp",
    "image-tga",
    "image-gif",
    "image-tiff",
    "image-ico",
    "image-qoi",
    "image-pnm",
    "image-dds",
    "image-hdr",
    "image-exr",
]

# GPU-compressed textures: KTX2 files (BC1-BC7, ETC2/EAC, ASTC 4x4 or RGBA8,
# optionally Zstandard or zlib supercompressed) and DDS files with BCn data
# upload as they are, with their mipmaps, at a quarter to an eighth of
# RGBA8's video memory. A GPU without the format gets the file decoded to
# RGBA8 on the CPU. Pure Rust: works on the web. `ponko textures` makes the
# files. See the guide's "Compressed textures".
compressed-textures = ["dep:ktx2", "dep:ruzstd", "dep:texture2ddecoder"]
# Basis Universal UASTC textures in KTX2, transcoded at load to what the GPU
# samples (BC7/BC5, ASTC 4x4, ETC2/EAC, or RGBA8). Builds Basis Universal's
# C++ transcoder; desktop and native only: on the web UASTC files fail to
# load with an `Unsupported` error.
basis-universal = ["compressed-textures", "dep:basis-universal"]

# Runs on the main thread (AppKit requires it), so it is its own program
# without the test harness. Does nothing off macOS.
[[test]]
name = "ui_access_macos"
harness = false

